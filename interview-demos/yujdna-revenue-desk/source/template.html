<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revenue Desk for yuj.dna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/*__FONTS__*/
/*__CSS__*/</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Screens">
    <div class="brand"><div class="brand-g" aria-hidden="true">Rd</div><div><div class="brand-n">Revenue Desk</div><div class="brand-s">for yuj.dna programs</div></div></div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="rail-foot"><div id="saveState"></div><div>Independent working tool. Not an official yuj.dna product.</div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-t"><h1 id="pageT">Today</h1><span class="sub" id="pageS"></span></div>
      <div class="top-actions">
        <label class="search"><span hidden>Find a lead</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gsearch" data-inp="gsearch" placeholder="Find a lead" autocomplete="off" aria-label="Find a lead"></label>
        <button type="button" class="btn primary" data-act="addLead"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Lead</button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-label="Lead"></aside>
<div class="scrim" id="scrim2" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>/*__APP__*/</script>
</body>
</html>
