/* Layout: a quiet desk. Light rail of fourteen screens on the left, one work surface on the right, a lead panel that slides in over it.
   Plum is the single action colour; saffron marks targets and the prospect's own words. Rail collapses to a scrolling strip on phones. */
:root {
  --bg: #f6f4f6; --surface: #ffffff; --surface-2: #f1eef2; --surface-3: #e7e2e8;
  --ink: #1b1620; --ink-2: #4a4351; --muted: #766d7d; --line: #e4dfe6; --line-2: #cfc8d2;
  --accent: #7b2a66; --accent-ink: #ffffff; --accent-soft: #f4e6f0; --accent-line: #dcb6d1;
  --mark: #d98a12; --mark-soft: #fbefd8;
  --good: #17804f; --good-bg: #e1f3e9; --warn: #9a6200; --warn-bg: #fbefd4; --crit: #bf3030; --crit-bg: #fbe3e1; --info: #2c5fb8; --info-bg: #e3ecfa;
  --shadow: 0 1px 2px rgb(27 22 32 / .05); --shadow-2: 0 2px 8px rgb(27 22 32 / .08), 0 22px 60px rgb(27 22 32 / .16);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI Variable Display", system-ui, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px; --r-s: 8px; --rail: 212px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121016; --surface: #1a171f; --surface-2: #221e28; --surface-3: #2c2733;
  --ink: #efeaf2; --ink-2: #c6bfcc; --muted: #958c9c; --line: #2b2632; --line-2: #3b3544;
  --accent: #dd8fc6; --accent-ink: #220d1c; --accent-soft: #35202f; --accent-line: #6d3c5e;
  --mark: #f0b24a; --mark-soft: #3a2b10;
  --good: #47c487; --good-bg: #12301f; --warn: #e9ad3c; --warn-bg: #33270d; --crit: #f0766c; --crit-bg: #3b1715; --info: #7fa9f0; --info-bg: #17233c;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-2: 0 2px 8px rgb(0 0 0 / .4), 0 22px 60px rgb(0 0 0 / .55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121016; --surface: #1a171f; --surface-2: #221e28; --surface-3: #2c2733;
  --ink: #efeaf2; --ink-2: #c6bfcc; --muted: #958c9c; --line: #2b2632; --line-2: #3b3544;
  --accent: #dd8fc6; --accent-ink: #220d1c; --accent-soft: #35202f; --accent-line: #6d3c5e;
  --mark: #f0b24a; --mark-soft: #3a2b10;
  --good: #47c487; --good-bg: #12301f; --warn: #e9ad3c; --warn-bg: #33270d; --crit: #f0766c; --crit-bg: #3b1715; --info: #7fa9f0; --info-bg: #17233c;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-2: 0 2px 8px rgb(0 0 0 / .4), 0 22px 60px rgb(0 0 0 / .55); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, p, ul, ol, dl, dd, pre { margin: 0; } ul, ol { padding: 0; list-style: none; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--accent); } button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.ico { width: 16px; height: 16px; flex: none; }
.sp { flex: 1; } .muted { color: var(--muted); } .fine { font-size: 12.5px; color: var(--muted); display: block; } p.fine, span.fine { line-height: 1.45; }
.crit-t { color: var(--crit); } .warn-t { color: var(--warn); } .muted-t { color: var(--muted); } .num { text-align: right; font-variant-numeric: tabular-nums; } .mono { font-family: var(--f-mono); font-size: 12.5px; }

/* shell */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 18px 12px 16px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 4px; }
.brand-g { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px/1 var(--f-display); letter-spacing: -.02em; flex: none; }
.brand-n { font: 650 15.5px/1.15 var(--f-display); letter-spacing: -.01em; } .brand-s { font-size: 11.5px; color: var(--muted); }
.nav-g { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; font-weight: 600; }
#nav a { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-weight: 500; }
#nav a:hover { background: var(--surface-2); color: var(--ink); } #nav a.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); font-weight: 600; }
#nav a span { flex: 1; }
.badge, .count { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 0 6px; min-width: 18px; text-align: center; line-height: 18px; }
.badge { background: var(--crit); color: #fff; } .count { background: var(--surface-3); color: var(--ink-2); }
.rail-foot { margin-top: auto; font-size: 11.5px; color: var(--muted); padding: 10px 6px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); margin-right: 6px; } .dot.good { background: var(--good); }
.main { min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); }
.top h1 { font: 650 21px/1.1 var(--f-display); letter-spacing: -.015em; } .top .sub { color: var(--muted); font-size: 13px; }
.top-t { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; flex: 1 1 260px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.search { position: relative; } .search .ico { position: absolute; left: 9px; top: 9px; color: var(--muted); } .search input { padding-left: 30px; width: 190px; }
.view { padding-block: 18px 64px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; max-width: 1320px; }

/* controls */
input, select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 7px 10px; min-width: 0; max-width: 100%; }
textarea { width: 100%; resize: vertical; line-height: 1.45; } input[type=checkbox] { padding: 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; margin: 2px 0 0; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-s); padding: 7px 12px; font-weight: 550; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent-line); background: var(--surface-2); } .btn:disabled { opacity: .5; cursor: default; }

const LS_KEY = "yuj-revenue-desk.v1";
const COLLS = ["leads", "accounts", "cohorts", "spend", "config"];
const Store = { mode: "starting", ready: false, note: "", data: { leads: {}, accounts: {}, cohorts: {}, spend: {}, config: {} }, db: null, subs: [], chain: Promise.resolve(), tok: {},
  pend: { leads: {}, accounts: {}, cohorts: {}, spend: {}, config: {} } };
let onStoreChange = () => {};

function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(Store.data)); } catch (e) { /* storage unavailable: keep working in memory */ } }
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); COLLS.forEach(c => { Store.data[c] = d[c] || {}; }); return true; } } catch (e) { /* ignore */ } return false; }

/* One write at a time, in order. Until a queued write lands, its document is overlaid on every snapshot so the screen never flickers back. */
function overlay(c, m) { const p = Store.pend[c]; for (const id in p) { if (p[id] === null) delete m[id]; else m[id] = p[id]; } return m; }
function dbWrite(coll, id, doc) {
  const k = coll + "/" + id, token = {}; Store.pend[coll][id] = doc; Store.tok[k] = token;
  Store.chain = Store.chain.then(() => doc ? Store.db.collection(coll).doc(id).set(doc) : Store.db.collection(coll).doc(id).delete()).catch(e => {
    const code = e && e.code;
    toast(code === "quota_exceeded" ? "Storage is full. Export and remove old leads." : code === "invalid_argument" ? "You have view-only access, so this change was not saved." : "Could not save just now. It will retry on your next change.", "crit");
  }).then(() => { if (Store.tok[k] === token) { delete Store.pend[coll][id]; delete Store.tok[k]; } });
}
function put(coll, doc) {
  const d = clone(doc); if (!d.id) d.id = uid(coll[0]);
  Store.data[coll] = Object.assign({}, Store.data[coll], { [d.id]: d });
  if (Store.mode === "db") dbWrite(coll, d.id, d); else saveLocal();
  return d;
}
function del(coll, id) {
  const m = Object.assign({}, Store.data[coll]); delete m[id]; Store.data[coll] = m;
  if (Store.mode === "db") dbWrite(coll, id, null); else saveLocal();
}
function conf() { return Store.data.config.main || { id: "main" }; }
function setConf(patch) { put("config", Object.assign({}, conf(), patch, { id: "main" })); }
function A() { const c = conf().assume || {}; const a = Object.assign({}, DEFAULTS, c); a.conv = Object.assign({}, DEFAULTS.conv, c.conv || {}); return a; }
function ruleOn(k) { const r = conf().rules || {}; return r[k] !== false; }

async function initStore() {
  let db = null;
  try { if (window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) {
    Store.mode = "local";
    const had = loadLocal();
    if (!had && !conf().sampleCleared) loadSample(true);
    Store.ready = true; onStoreChange(); return;
  }
  Store.mode = "db"; Store.db = db;
  const seen = {}; let left = COLLS.length;
  const timer = setTimeout(() => { if (!Store.ready) { Store.note = "Your saved pipeline has not loaded yet. It will appear here as soon as the connection answers."; onStoreChange(); } }, 10000);
  COLLS.forEach(c => {
    const done = () => { if (!seen[c]) { seen[c] = true; left--; if (left === 0) { Store.ready = true; Store.note = ""; clearTimeout(timer); } } };
    Store.subs.push(db.collection(c).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { const v = d.data(); if (v) m[d.id] = Object.assign(clone(v), { id: d.id }); });
      Store.data[c] = overlay(c, m); done(); onStoreChange();
    }, err => { done(); Store.note = err && err.code === "revoked" ? "Access to the saved pipeline was withdrawn." : "The saved pipeline could not be read."; onStoreChange(); }));
  });
}
function loadSample(silent) {
  const s = sampleWorkspace(Date.now());
  s.leads.forEach(l => { l.lastOpenStage = FLOW.includes(l.stage) ? l.stage : (Object.keys(l.diag || {}).length ? "diagnosed" : "contacted"); put("leads", l); });
  s.cohorts.forEach(c => put("cohorts", c)); s.spend.forEach(x => put("spend", x));
  if (!silent) toast("Sample workspace loaded");
}
function clearSample() {
  ["leads", "cohorts", "spend", "accounts"].forEach(c => Object.values(Store.data[c]).filter(x => x.sample).forEach(x => del(c, x.id)));
  setConf({ sampleCleared: true });
}
const leads = () => Object.values(Store.data.leads);

function listPrice(prog, a) { a = a || A();
  if (prog === "p2") return a.priceP2; if (prog === "combo") return Math.round((a.priceP1 + a.priceP2) * (1 - a.comboDiscountPct / 100)); return a.priceP1; }

  const list = listPrice(prog, a), parts = (leverKeys || []).map(k => { const L = LEVERS.find(x => x.key === k); return L ? { key: k, name: L.name, pct: L.maxPct, buys: L.buys } : null; }).filter(Boolean);

  const margin = net - cost - a.cacTarget, marginPct = net ? Math.round(100 * margin / net) : 0;

function leadScore(l) {
  const parts = [];

  parts.push({ g: "Fit", k: "Segment", pts: seg ? (core ? 15 : 10) : 5, max: 15, why: seg ? (core ? "Core segment" : "Adjacent segment") : "Segment not set" });

  const cs = l.coStage || "";

  parts.push({ g: "Fit", k: "Who pays", pts: l.payer === "employer" || l.payer === "split" ? 10 : l.payer === "self" ? 7 : 4, max: 10, why: (PAYERS.find(p => p.key === l.payer) || PAYERS[0]).name });

function diagSummary(l) {

    '<section class="panel"><div class="panel-h"><h2>Lines not to cross<\/h2><\/div><ul class="ticks pad"><li>No invented deadlines or seat counts.<\/li><li>No loan pushed on someone who has said they cannot afford it. An EMI is a loan: name the lender, the tenure and the cancellation terms.<\/li><li>No promise of salary, promotion or placement.<\/li><li>No discount to close. A reduction is a scholarship with a reason, from the pool.<\/li><li>If it is not right for them, say so. They will send you someone it is right for.<\/li><\/ul><p class="fine pad">Indian edtech lost public trust through pressure selling and loans people did not understand. Buyers in this market are alert to it. Being plainly the opposite is an advantage. ' + evChip("fibe") + evChip("kt") + "<\/p><\/section>";

    '<section class="panel"><div class="panel-h"><h2>Why give a scholarship at all<\/h2><\/div><div class="pad prose"><p>A cohort has fixed mentor time and a fixed number of seats. A seat that is empty on start day earns nothing and cannot be sold later. So the arithmetic says: fill it at almost any price above the cost of delivering it.<\/p><p>The psychology says the opposite. A discounted program is valued less, worked at less, and teaches every full-fee buyer to wait. ' + evChip("shiv") + " In a small cohort people compare notes.<\/p><p>The way through is to stop discounting and start buying. A scholarship is a fee reduction given <b>in exchange for something the program needs<\/b>: certainty, a referral, a second seat, public proof, a door into a target company, a stronger cohort, or access for someone who could not otherwise come. Each has a value. The reduction should never be larger than what it buys.<\/p><\/div><\/section>" +
    '<section class="panel"><div class="panel-h"><h2>Why this number and not a larger one<\/h2><\/div><div class="pad prose"><p>Three limits apply, and the smallest wins.<\/p><ol><li><b>What the lever buys.<\/b> A referral saves about ' + inr(a.cacTarget) + " of acquisition cost, which is " + (100 * a.cacTarget / a.priceP1).toFixed(1) + "% of the Program 1 fee. Giving back up to 8% leaves the program ahead. Giving 15% would be paying more for the referral than it saved.<\/li><li><b>The stacking cap of " + a.stackCapPct + "%.<\/b> This one is about the price meaning something, not about margin.<\/li><li><b>The margin floor of " + a.minMarginPct + "%.<\/b> At your numbers Program 1 could fall to " + inr(f1.net) + " (" + f1.pct + "% off) and Program 2 to " + inr(f2.net) + " (" + f2.pct + "% off) before breaking it.<\/li><\/ol><p>Notice the gap between the second and third. The economics would tolerate a much deeper discount than the cap allows. The cap is there because of what discounting does to how the program is valued, to the people paying in full, and to next cohort’s buyers who hear about it.<\/p><p>The <b>pool<\/b> is the last guard: " + a.poolPct + "% of a cohort’s list revenue, about " + inrShort(a.seatsP1 * a.priceP1 * a.poolPct / 100) + ' for a full Program 1 cohort. When it is spent, it is spent. That makes a scholarship scarce, which is what makes it mean something to the person who gets one.<\/p><\/div><\/section>' +
    '<section class="panel"><div class="panel-h"><h2>The levers<\/h2><\/div><div class="tbl-w"><table class="tbl"><thead><tr><th>Lever<\/th><th class="num">Up to<\/th><th>What it buys<\/th><th>How to set the figure<\/th><\/tr><\/thead><tbody>' + LEVERS.map(L => "<tr><td><b>" + esc(L.name) + '<\/b><\/td><td class="num">' + L.maxPct + "%<\/td><td>" + esc(L.buys) + "<\/td><td>" + esc(L.basis) + "<\/td><\/tr>").join("") + '<\/tbody><\/table><\/div><p class="fine pad">All percentages and the cost figures behind them are starting assumptions. Replace them in <a href="#setup">Setup<\/a> once you know the real delivery cost and your approval limits.<\/p><\/section>';
  return tabs("pricing", [["calc", "Scholarship calculator"], ["why", "Why it works this way"]]) +
    '<div class="split even"><section class="panel"><div class="panel-h"><h2>Build an offer<\/h2><\/div><div class="pad"><label class="field"><span>Program<\/span><select id="pc-prog" data-chg="calcProg">' + Object.values(PROGRAMS).map(p => opt(p.key, p.short + " · " + inr(listPrice(p.key, a)), c.prog)).join("") + '<\/select><\/label><div class="levers">' + LEVERS.map(L => '<label class="lever"><input type="checkbox" id="pc-' + L.key + '" ' + (c.levers.includes(L.key) ? "checked" : "") + ' data-chg="calcLever" data-k="' + L.key + '"><div><b>' + esc(L.name) + ' <span class="muted">up to ' + L.maxPct + '%<\/span><\/b><span class="fine">' + esc(L.basis) + "<\/span><\/div><\/label>").join("") + "<\/div><\/div><\/section>" +

  else if (t === "size") { const tam = a.tamPm + a.tamDesign + a.tamAdjacent, sam = Math.round(tam * a.reachPct / 100), som = Math.round(sam * a.fitPct / 100), cap = a.seatsP1 * a.cohortsYearP1 + a.seatsP2 * a.cohortsYearP2, rev = a.seatsP1 * a.cohortsYearP1 * a.priceP1 + a.seatsP2 * a.cohortsYearP2 * a.priceP2;

    body = '<div class="split even"><section class="panel"><div class="panel-h"><h2>How the score is built<\/h2><\/div><div class="pad"><p>Two questions, fifty points each. <b>Fit:<\/b> is this the kind of person the program is for, and can it be paid for? <b>Intent:<\/b> are they acting like someone who is deciding?<\/p>' + ex.parts.map(p => barRow("<b>" + esc(p.k) + '<\/b> <span class="muted">' + esc(p.g) + "<\/span>", p.max, 20, { text: "up to " + p.max })).join("") + '<p class="fine">Hot is 70 and above, warm 45 to 69. Intent decays: a lead untouched for two weeks loses all ten recency points, which is how going cold shows up in the list.<\/p><\/div><\/section>' +
      '<section class="panel"><div class="panel-h"><h2>Is the score right?<\/h2><span class="muted">your own data<\/span><\/div><div class="tbl-w"><table class="tbl"><thead><tr><th>Band<\/th><th class="num">Leads<\/th><th class="num">Closed<\/th><th class="num">Won<\/th><th class="num">Win rate<\/th><\/tr><\/thead><tbody>' + row("hot", "Hot 70+") + row("warm", "Warm 45–69") + row("cool", "Cool under 45") + '<\/tbody><\/table><\/div><div class="pad"><p>If hot leads do not win more often than warm ones after fifty or so closed leads, the weights are wrong for this market and should change. Until then they are a reasoned starting point: source and signals carry the most weight because behaviour predicts buying better than job title.<\/p><div class="note">The score orders the list. It does not decide who deserves a call. Every new lead gets one inside the hour.<\/div><\/div><\/section><\/div>'; }

  doRestore: () => { let d; try { d = JSON.parse(document.getElementById("rs-text").value); } catch (e) { toast("That is not a valid backup file.", "crit"); return; }
    if (!d || typeof d !== "object" || !d.leads) { toast("That file has no leads in it.", "crit"); return; }
    COLLS.forEach(c => { Object.keys(Store.data[c]).forEach(id => del(c, id)); Object.values(d[c] || {}).forEach(x => { if (x && x.id) put(c, x); }); }); closeModal(); render(); toast("Restored"); },
  wipe: () => { if (!UI.confirmWipe) { UI.confirmWipe = true; render(); return; } UI.confirmWipe = false; ["leads", "accounts", "cohorts", "spend"].forEach(c => Object.keys(Store.data[c]).forEach(id => del(c, id))); setConf({ assume: {}, rules: {}, answers: {}, plan: {}, sampleCleared: true }); render(); toast("Everything deleted"); }
});

/* ---------- boot ---------- */
(function boot() {
  onStoreChange = safeRender; readHash(); wire(); render();
  initStore().then(() => render()); initCaps();
})();
</script>
