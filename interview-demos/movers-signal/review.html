 liable to\nretire by rotation, upon the terms and conditions including remuneration as mentioned herein below, which are specifically hereby\napproved, with further authority to the Board to alter and vary the terms and conditions of the said appointment, remuneration and\n/ or agreement including increments and revisions and / or any other components of the remuneration (including authority, from\ntime to time to determine the amount of salary as also the type and amount of perquisites and other benefits payable to Mr. Anup\nBagchi), as may be necessary from time to time during the tenure of Mr. Anup Bagchi as the MD & CEO of the Bank, subject to\nthe approval of RBI:\nParticulars Amount in ` (annualized)\nPART-A:\nFixed Pay (including perquisites):\n1. Salary 3,31,86,378\n2. Dearness allowance -\n3. Retiral/Superannuation benefits:\n(a) Provident Fund 39,82,365\n(b) Gratuity ^ 21,37,966\n(c) Pension / NPS * 46,46,093\n(d) Superannuation * 49,77,957\n4. Leave Fare Concession/ Allowance 55,31,063\n5. Other fixed allowances, if any (please specify)* 1,09,10,442\n*Consolidated allowance, if any, to be given with details of heads it subsumes.\n6. Perquisites: (details for each perquisite described below)\n(i) Free Furnished House and its maintenance / House Rent Allowance 1,65,93,189\n1", "11": "EXPLANATORY STATEMENT PURSUANT TO SECTION 102 OF THE COMPANIES ACT, 2013\nThe following Explanatory Statement sets out the relevant information as required under Section 102 and other applicable provisions,\nif any, of the Companies Act, 2013 (the “Act”), read with rules framed thereunder and the Securities and Exchange Board of India\n(Listing Obligations and Disclosure Requirements) Regulations, 2015 (“Listing Regulations”).\nResolution No. 1\nThe Members of the Bank, vide resolution passed through Postal Ballot on January 9, 2024, had approved the re-appointment of\nMr. Sashidhar Jagdishan as the Managing Director & Chief Executive Officer (“MD & CEO”) of the Bank, for a period of 3 (three)\nyears commencing from October 27, 2023 up to October 26, 2026 (both days inclusive) along with his remuneration.\nMr. Sashidhar Jagdishan on August 29, 2026, communicated his decision to the Board of Directors to not seek re-appointment as\nthe MD & CEO of the Bank, post the completion of his current tenure. The Board of Directors, placed on record its appreciation for\nMr. Jagdishan’s long association and contribution to the growth of the Bank and noted his communication to not seek re-appointment,\nand accordingly, Mr. Jagdishan would be retiring from the services of the Bank upon the close of business hours on October 26, 2026.\nConsequent to receipt of such communication from Mr. Jagdishan, the Governance, Nomination and Remuneration Committee\n(“GNRC”) convened few meetings immediately thereafter and undertook a detailed review of potential candidates, both internal\nand external. Following these deliberations, the GNRC and the Board of Directors of the Bank, at their respective meetings held on\nSeptember 12, 2026, evaluated and shortlisted candidates for the position of MD & CEO, after assessing a wide range of attributes\nincluding leadership and strategic vision, depth of banking and financial services experience, exposure to large scale operations,\nrisk management acumen, regulatory and compliance orientation, stakeholder management capability, governance track record,\ndigital and technology transformation experience and overall understanding of the Bank’s business model and long term priorities.\nThe GNRC and the Board of Directors also assessed the compliance of the shortlisted candidates with the ‘Fit and Proper’ criteria\nin terms of the Banking Regulation Act, 1949, Reserve Bank of India (Commercial Banks - Governance) Directions, 2025 and\nother relevant directions, circulars and notifications issued by the Reserve Bank of India (“RBI”) from time to time, the Listing\nRegulations and the Policy on Appointment and Fit and Proper Criteria for Directors of the Bank, along with other applicable rules\nand regulations. The Board of Directors thereafter finalized the terms and conditions relating to the said appointment, including\nremuneration, and recommended the same for the approval of the RBI.\nPursuant to the application made by the Bank, the RBI, vide its letter dated October 1, 2026, granted its approval from the candidates\nshortlisted by the Bank, for the appointment of Mr. Anup Bagchi as the MD & CEO of the Bank, for a period of 3 (three) years,\ncommencing from October 27, 2026 till October 26, 2029.\nMr. Anup Bagchi is a seasoned financial services leader with over three decades of experience across banking, capital markets,\nwealth management and insurance. A member of the ICICI Group since 1992, he has built a diverse career spanning treasury, retail\nbanking, wholesale banking, investment banking, and digital financial services. Over the course of his career, he has held several\npivotal leadership positions, including CEO & MD of ICICI Securities Limited, Executive Director of ICICI Bank Limited, and currently\nis the MD & CEO of ICICI Life Insurance Limited (formerly known as ICICI Prudential Life Insurance Company Limited). His career\nreflects a strong track record of business building, strategic leadership, and navigating the evolving financial services landscape.\nMr. Bagchi served as an Executive Director of ICICI Bank Limited from 2017 to 2023, overseeing Retail, Business and Rural Banking,\nand subsequently Wholesale Banking. During his tenure, he played a key role in strengthening the ICICI Bank’s retail franchise,\ndriving profitable growth while maintaining credit and cost discipline. Under his leadership, ICICI Bank Limited became the first\nprivate-sector bank in India to surpass a retail mortgage portfolio of Rs. 2 trillion and successfully navigated the demonetisation\nperiod with limited business disruption. Alongside his executive responsibilities, he served as Chairman of ICICI Prudential Asset\nManagement Company Limited until May 2023 and was a Director of ICICI Prudential Pension Fund Management Limited and\nICICI Home Finance Company Limited.\nSince June 2023, Mr. Bagchi has been serving as the MD & CEO of ICICI Life Insurance Limited, leading one of India’s largest\nprivate life insurers, which is publicly listed. Under his leadership, the company crossed Rs. 10,000 crore in Annualised Premium\nEquivalent (APE) for the first time in FY2025, with APE growing 15% year-on-year to Rs. 10,407 crore and profit after tax increasing\nnearly 40% to Rs. 1,189 crore. The business has also delivered strong growth in protection products and new business generation,\nreflecting his focus on sustainable and profitable expansion.\nBased on the said RBI approval and the recommendation of GNRC, the Board of Directors of the Bank, at its meeting held on\nOctober 1, 2026 appointed Mr. Bagchi as the MD & CEO of the Bank, for a period of 3 (three) years, with effect from October\n27, 2026 up to October 26, 2029 (both days inclusive) on the terms and conditions, including remuneration as mentioned in the\nResolution No. 1, subject to the approval of the Members of the Bank.\nIn order to facilitate smooth transition, the Board of Directors of the Bank, based on the recommendation of the GNRC, at the said\nmeeting also appointed Mr. Bagchi as an Additional Director of the Bank with effect from October 2, 2026 till the date of approval\nof Members of the Bank.\nMr. Bagchi meets the fit and proper criteria as prescribed by the RBI and is not disqualified from being appointed as a Director in\nterms of Section 164 of the Companies Act, 2013 (the “Act”). In the opinion of the Board of Directors, he fulfils the conditions for\nthe said appointment as prescribed under the relevant provisions of the Act and the relevant Rules made thereunder, the Listing\nRegulations, the Banking Regulation Act, 1949 and other guidelines issued by the RBI from time to time. Mr. Bagchi has the requisite\nqualifications, skills, experience and expertise in specific functional areas, which are beneficial to the Bank. He has furnished to\nthe Bank his consent to act as a Director of the Bank and affirmed that he is not debarred from holding office of Director by virtue\nof any order of the Securities and Exchange Board of India or any other such authority.\n10", "12": "Pursuant to the relevant provisions of the Articles of Association of the Bank, Mr. Bagchi shall not be liable to retire by rotation in\nterms of the provisions of Section 152 of the Act during his tenure as the MD & CEO of the Bank.\nAs regards the annual increment in the remuneration of Mr. Bagchi, the same is performance linked and subject to the approval of\nthe RBI, each year. Further, the average increase in the fixed remuneration of Whole-Time Directors (“WTDs”) over the last 5 years\nhas been in the range of 4.0% to 8.0% and the payment of variable component including cash bonus and ESOPs as a percentage\nof Fixed Pay, has been generally capped between 200% - 300%.\nBased on the current remuneration structure, the Bank expects that during Mr. Bagchi’s tenure as the MD & CEO of the Bank, the\nannual increments in the fixed remuneration would continue to remain within a similar range and the variable pay as a percentage\nof fixed pay will continue to be capped at 300%, subject to the approval of the GNRC, Board of Directors and RBI, every year.\nThe Bank has also received a notice under Section 160 of the Act from a member proposing the candidature of Mr. Anup Bagchi\nas the Director of the Bank.\nBrief profile of Mr. Anup Bagchi in terms of the Listing Regulations and the Secretarial Standard on the General Meetings\n(“SS-2”) has been provided in this Explanatory Statement as under:\nDirector Identification Number (DIN) 00105962\nAge 56 years\nNationality Indian\nQualifications • Management degree from Indian Institute of Management, Bangalore; and\n• Enginee ed Financial Analyst (CFA) and holds an MBA in Finance\n& IT from the Institute of Chartered Financial Analysts of India (ICFAI).\nRegistered Office: 202, 2nd Floor, Sahjanand Shopping Centre, Opp. Swaminarayan Temple, '[HE.Ecxwu,clhnci,\nINDIA'S\nShahibaug, Ahmedabad - 380 004, Gujarat. Phone: [phone redacted]\nGROWTH\nCorporate Office: \"GTPL House': Sindhu Bhavan Road, Bodakdev, Ahmedabad - 380 059. CHAMPIONS\nPhone: [phone redacted] Email: [email redacted] Web: www.gtpl.net 2022 statlsta!>"}, "quotes": ["GTPL Hathway Limited", "Trading Symbol: GTPL", "in place of Mr. Saurav Banerjee who superannuates on September 30, 2026", "as Chief Financial Officer (Key Managerial Personnel) of the Company", "who superannuates on September 30, 2026 (close of business hours).", "Date: September 18, 2026", "who superannuates on September 30, 2026 (close of business hours).", "who superannuates on September 30, 2026 (close of business hours).", "Appointment of Mr. Piyush Pankaj, currently serving as the Business Head – B2B (CATV", "has been associated with the Company for the last 10 years", "Appointment of Mr. Piyush Pankaj, currently serving as the Business Head – B2B (CATV", "of the Company with effect from October 1, 2026,"]}, {"id": "info-edge-20261028-md-ceo", "company": "Info Edge (India) Limited", "practice": "Digital", "source_url": "https://www.bseindia.com/xml-data/corpfiling/AttachHis/6430107d-c92e-4c13-b770-73bcbc8912f6.pdf", "source_page": 1, "fields": {"company": "Info Edge (India) Limited", "exchange_symbol": "NAUKRI", "practice": "Digital", "person_name": "Hitesh Oberoi", "role_title": "Managing Director and Chief Executive Officer", "role_level": "CEO_MD", "event_type": "RESIGNATION", "filing_date": "2026-10-28", "effective_date": "2026-12-02", "effective_date_note": null, "stated_reason": "to devote more time to his personal interests", "successor_status": "NAMED_PERMANENT", "successor_source": "INTERNAL", "successor_name": "Sanjeev Bikhchandani"}, "evidence": approved the following:\n1. Transition of Mr. Hitesh Oberoi from full-time operating role\nThe Board of Directors took note of the decision of Mr. Hitesh Oberoi (DIN: 01189953) to step down from his\npositions as Managing Director and Chief Executive Officer (Key Managerial Personnel) of the Company, with\neffect from the close of business hours on December 2, 2026, after nearly 27 years with Info Edge. This decision\nhas been taken by Mr. Oberoi after careful consideration, in order to devote more time to his personal interests\nin education, entrepreneurship, institution building, investing and philanthropy, as well as to spend more time\nwith his family.\nThe Board places on record its appreciation for Mr. Oberoi’s significant contributions to the Company over\nnearly 27 years and his role in building and strengthening its businesses and leadership team.\n2. Appointment of Mr. Hitesh Oberoi as Additional Director\nBased on the recommendation of the Nomination and Remuneration Committee, the Board of Directors\napproved the appointment of Mr. Hitesh Oberoi (DIN: 01189953) as an Additional Director, designated as a\nNon-Executive, Non-Independent Director under the Promoter Category, liable to retire by rotation, with effect\nfrom December 3, 2026, subject to the approval of the members of the Company.\nMr. Oberoi’s appointment will enable the Board to continue to benefit from his extensive experience,\ninstitutional knowledge and deep understanding of the Company’s businesses.\n.,\nQ naukri Q naukrigulf 99acres Jeevansathi.com ~f shiksha\nINFO EDGE (INDIA) LIMITED\nCorporate Office: B-8, Sector - 132, Noida - 201304, Tel.: [phone redacted], Fax: [phone redacted]\nEmail: [email redacted] URL: http://www.infoedge.in CIN: L74899DL1995PLC068021\nRegd. Office: Ground Floor, 12A, 94, Meghdoot, Nehru Place, New Delhi-110019", "2": "infoedge\n3. Appointment and re-designation of Mr. Sanjeev Bikhchandani as Executive Vice Chairman, Managing\nDirector and Group Chief Execut ole_level": {"status": "match", "reason": "rule gives CEO_MD (Company CEO or Managing Director)"}, "practice": {"status": "match", "reason": "config/practices.json gives Digital"}}, "verify_v1_problems": [], "flags": [], "corrections": [], "ai": {"id": "niit-20261014-ceo", "decision": "VERIFIED", "note": "Read beside the source PDF. Verification v2: 13 fields match, 0 confirmed absent.", "overrides": []}, "review_test": null, "pages": {"1": "October 14, 2026\nThe Manager The Manager\nBSE Limited National Stock Exchange of India Limited\nCorporate Relationship Department, Listing Department\n1st Floor, New Trading Ring, Exchange Plaza\nRotunda Building 5th Floor, Plot no C/1, G Block\nPhiroze Jeejeebhoy Towers Bandra Kurla Complex\nDalal Street, Mumbai 400 001 Bandra (E),Mumbai – 400 051\nSubject: Intimation pursuant to Regulation 30 of the SEBI (Listing Obligations &\nDisclosure Requirements) Regulations 2015 (“Listing Regulations\")\nScrip Code : BSE – 500304; NSE – NIITLTD\nDear Sir,\nPursuant to Regulation 30 of Listing Regulations, we hereby inform you that the Board of\nDirectors of the Company, at its meeting held today i.e., October 14, 2026 (which commenced\nat 03:04 p.m. and concluded at 3:47 p.m.), has, inter alia, considered and approved the\nfollowing:\n1. Take on record and accept resignation of Mr. Pankaj Prabhakar Jathar from the position\nof Chief Executive Officer of the Company effective October 14, 2026, as he wishes to\npursue other interests. He also ceases to be Key Managerial Personnel of the Company\nin terms of the provisions of Section 203 of the Companies Act, 2013 (read with the\napplicable rules framed thereunder).\nMr. Jathar shall be relieved from his services of the Company with effect from close of\nbusiness hours on October 22, 2026. Consequent to his cessation, he shall also cease\nto be Senior Managerial Personnel in terms of SEBI (Listing Obligations & Disclosure\nRequirements) Regulations, 2015 on that date.\n2. Based on the recommendation of the Nomination and Remuneration Committee,\napproved the appointment of Mr. Anish Kumar Sarkar as Chief Executive Officer\nand Key Managerial Personnel of the Company w.e.f. October 14, 2026 in terms of the\nprovisions of Section 203 of the Companies Act, 2013 (read with the applicable rules\nframed thereunder) and Senior Managerial Personnel in terms of SEBI (Listing\nObligations & Disclosure Requirements) Regulations, 2015.", "2": "The details required in terms of Regulation 30 read with Schedule III of the Listing Regulations\nand SEBI Circulars issued in this regard, are given in Annexure A.\nYou are requested to take note of the same and inform your members accordingly.\nThanking you,\nYours truly,\nFor NIIT Limited\nArpita B Malhotra\nCompany Secretary &\nCompliance Officer\nEncls : a/a", "5": "Annexure 2\nProfile of Mr. Anish Kumar Sarkar – Chief Executive Officer\nAnish Sarkar is a seasoned executive leader with over two decades of experience in business\nbuilding, transformation and M&A-led growth across consulting and operational leadership\nroles. Prior to joining NIIT, he was Managing Director – India and Director of the India /\nPhilippines / Indonesia Cluster at Pluxee (formerly Sodexo BRS), a global employee benefits\nand engagement company; and CEO of Mercer India, a global leader in human capital\nconsulting. At both these organisations, he led strong revenue growth and portfolio expansion,\nincluding strategic acquisitions.\nEarlier, Anish spent several years with the Capgemini Group in senior leadership roles\nspanning management consulting, sales and technology transformation. Across these roles,\nhe built deep experience in growth strategy, client partnerships, digital transformation and\ntechnology-led business growth. An alumnus of IIT Kharagpur and IIM Calcutta, Anish brings\na distinctive blend of business, human capital and technology expertise to NIIT."}, "quotes": ["For NIIT Limited", "Scrip Code : BSE – 500304; NSE – NIITL ce": {"status": "match", "reason": "config/practices.json gives Information Technology"}}, "verify_v1_problems": [], "flags": [], "corrections": [], "ai": {"id": "hexaware-20260902-ceo", "decision": "VERIFIED", "note": "Read beside the source PDF. Verification v2: 13 fields match, 0 confirmed absent.", "overrides": []}, "review_test": null, "pages": {"1": "HEXT/SE/2026/90 Date: September 02, 2026\nTo,\nDepartment of Corporate Services Listing Department\nBSE Limited National Stock Exchange of India Limited\n1st floor, Phiroze Jeejeebhoy Towers Exchange Plaza, C-1, Block G\nDalal Street, Mumbai 400 001 Bandra Kurla Complex, Bandra (E)\nMaharashtra, India Mumbai 400 051\nScrip Code: 544362 Maharashtra, India\nSymbol: HEXT\nSir/Madam,\nSub: Disclosure of material events under Regulation 30 of the SEBI (Listing Obligations and Disclosure\nRequirements) Regulations, 2015.\nPursuant to the Regulation 30 of the SEBI (Listing Obligations and Disclosure Requirements)\nRegulations, 2015 (“SEBI Listing Regulations”), we hereby inform you the following:\n1. Mr. Srikrishna Ramakarthikeyan (DIN: 03160121), Chief Executive Officer (CEO) and Whole-\ntime Director, vide email dated September 02, 2026, has submitted his resignation as (i) the CEO\nof Hexaware Technologies Limited (the “Company”) and of Hexaware Technologies Inc., a wholly\nowned subsidiary of the Company (“HTI”); (ii) Whole-time Director of the Company; and (iii)\nDirector of the subsidiaries of the Company, in each case, with effect from October 28, 2026.\n2. Basis recommendation of the Nomination and Remuneration Committee, the Board of Directors\nof the Company has today i.e., September 02, 2026, approved the appointment of Mr. Srikrishna\nRamakarthikeyan as Senior Advisor to the Company with effect from October 28, 2026.\n3. Basis recommendation of the Nomination and Remuneration Committee, the Board of Directors\nof the Company has today i.e., September 02, 2026, approved the appointment of Mr. Vivek\nJetley, as the Chief Executive Officer (CEO) of the Company with effect from October 28, 2026.\nThe details required in terms of Regulation 30 read with Schedule III - Para A(7) and Para A (7C) of Part\nA of the SEBI Listing Regulations and SEBI Circular No. HO/49/14/14(7)2025-CFD-POD2/I/3762/2026\ndated January 30, 2026 (“SEBI Master Circular”), are enclosed as annexures below.\nThe above information is also available on the website of the Company at www.hexaware.com.\nThe meeting commenced at 5.35 PM IST and concluded at 5.53 PM IST.\nWe request you to kindly take the same on your record.\nThanking you,\nFor Hexaware Technologies Limited\nGunjan Methi\nCompany Secretary and Compliance Officer\nHEXAWARE TECHNOLOGIES LIMITED\nRegd. Office: 8th Floor, 13th Level,Q1, Loma Co-Developers1 Private Limited, Plot No.Gen-4/1,TTC Industrial Area,\nGhansoli, Navi Mumbai-400710, Maharashtra, India | Tel: [phone redacted] | Email: [email redacted]\nCIN: L72900MH1992PLC069662 | URL: www.hexaware.com", "3": "Annexure B\nInformation as required under Regulation 30 read with Schedule III - Para A(7) of Part A of the SEBI\n(Listing Obligations and Disclosure Requirements) Regulations, 2015, read along with SEBI Circular\nNo. HO/49/14/14(7)2025-CFD-POD2/I/3762/2026 dated January 30, 2026 is furnished below:\nSr. No Particulars Details\n1. Reason for change viz. Appointment, Appointment of Mr. Vivek Jetley as Chief\nre-appointment, resignation, removal, Executive Officer.\ndeath or otherwise;\n2. Date of appointment/re- Mr. Vivek Jetley shall hold office as the Chief\nappointment/cessation (as applicable) Executive Officer, for a period of 4 (four)\n& term of appointment/re-appointment; years with effect from October 28, 2026.\n3. Brief profile (in case of appointment); Enclosed herewith as Annexure C.\n4. Disclosure of relationships between Not Applicable.\ndirectors (in case of appointment of a\ndirector).\nHEXAWARE TECHNOLOGIES LIMITED\nRegd. Office: 8th Floor, 13th Level,Q1, Loma Co-Developers1 Private Limited, Plot No.Gen-4/1,TTC Industrial Area,\nGhansoli, Navi Mumbai-400710, Maharashtra, India | Tel: [phone redacted] | Email: [email redacted]\nCIN: L72900MH1992PLC069662 | URL: www.hexaware.com", "4": "Annexure C\nVivek Jetley\nVivek is a seasoned business leader with more than 25 years of\nexperience at the intersection of AI and data, enterprise\ntransformation and strategy. He has a proven track record of\nscaling global businesses, leading large P&Ls, and creating new\ngrowth engines during periods of technology disruption from data\nand cloud to GenAI. He brings deep experience in management\nconsulting, analytics, and data and AI-led transformation, delivering\nmeasurable outcomes for large global and Fortune 500 enterprise\nclients.\nHe joins Hexaware from EXL, where he currently serves as\nPresident and leads their Insurance, Healthcare and Life Science\nbusinesses. Prior to this role, he was the President of EXL\nanalytics, building and leading industry-leading advanced\nanalytics, AI services, and enterprise data management capabilities for clients across verticals.\nVivek joined EXL in 2006 through the acquisition of Inductis, a specialized analytics consulting firm\nwhere he was a partner. During two decades at EXL, Vivek has held various leadership roles with\nresponsibility for corporate strategy, strategic partnerships, innovation, and has led several acquisitions.\nOver the years, Vivek has been instrumental in EXL’s transformation from an Operations company to a\ndata and AI-led, high value, high growth enterprise.\nHe started his career as a consultant with Mitchell Madison Group in New York. Vivek holds a bachelor’s\ndegree in computer engineering and a master’s of business administration from the Indian Institute of\nManagement Calcutta.\nHEXAWARE TECHNOLOGIES LIMITED\nRegd. Office: 8th Floor, 13th Level,Q1, Loma Co-Developers1 Private Limited, Plot No.Gen-4/1,TTC Industrial Area,\nGhansoli, Navi Mumbai-400710, Maharashtra, India | Tel: [phone redacted] | Email: [email redacted]\nCIN: L72900MH1992PLC069662 | URL: www.hexaware.com", "5": "Annexure D\nThe Board of Directors\nHexaware Technologies Limited\n8th floor, 13th Level, Q1, Loma Co-Developers1 Private Limited,\nPlot no. Gen-4/1, TTC Industrial Area, Ghansoli,\nNavi Mumbai, Maharashtra, 400710\nDear Board Members,\nSub: Resignation from the position of (i) the Chief Executive Officer of Hexaware Technologies Limited\nand of Hexaware Technologies Inc.; (ii) Whole-time Director of Hexaware Technologies Limited; and (iii)\nDirector of the subsidiaries of Hexaware Technologies Limited, in each case, with effect from October\n28, 2026.\nI am writing to tender my resignation as (i) the Chief Executive Officer of Hexaware Technologies Limited\n(the “Company”) and of Hexaware Technologies Inc., a wholly owned subsidiary of the Company\n(“HTI”); (ii) Whole-time Director of the Company; and (iii) Director of the subsidiaries of the Company,\nin each case, with effect from October 28, 2026, to pursue personal interests.\nServing in this role has been one of the most fulfilling chapters of my professional life, and I am deeply\ngrateful for the trust placed in me by the Board, our shareholders, and the broader Hexaware family.\nDuring my tenure, I have had the privilege of witnessing and contributing to a meaningful transformation\nof the company, both in terms of financial performance and the positive impact we have had on our\nassociates, clients, and partners.\nI request you to kindly acknowledge the receipt of this resignation letter and complete all necessary\ncompliances, including the filing of required filings and e-forms with the stock exchanges and Registrar\nof Companies in accordance with applicable laws.\nI will remain available to the Company and its subsidiaries to support a smooth transition and I leave\nwith every confidence in the company’s continued growth and success.\nYours faithfully,\n_________________________\nMr. Srikrishn der Regulation 30 of the SEBI (Listing Obligations and Disclosure Requirements)\nRegulations, 2015 read (“Listing Regulations”) read with SEBI Circulars are enclosed as Annexure-A. The letter\nof resignation received from Mr. Poempner is enclosed as Annexure-B.\nThis outcome of the Board Meeting is being made available on the website of the Company at\nwww.gmmpfaudler.com\nKindly take the same on record.\nThanking you.\nYours faithfully,\nFor GMM Pfaudler Limited\nMittal Mehta\nCompany Secretary & Compliance Officer\nFCS. No. 7848\nEncl.: As above", "2": "Annexure-A\nChange in Group Chief Financial Officer (CFO) & Key Managerial Personnel (KMP):\nThe Board noted the resignation of Mr. Alexander Poempner as Group CFO & KMP of the Company, effective at\nthe conclusion of the Board Meeting at which the unaudited financial results for the quarter and half year ended\nSeptember 30, 2026 (Q2 FY27) will be approved, currently planned for November 4, 2026.\nThe Board further noted that Mr. Poempner will continue with the organization until December 31, 2026, to\nensure an orderly handover and provide transition support.\nThe Board approved the appointment of Mr. Ankit Nayyar as Group CFO & KMP of the Company, effective at the\nconclusion of the said Board Meeting based on the recommendations of the Nomination & Remuneration\nCommittee and the Audit Committee.\nThe Board of Directors places on record its appreciation for Mr. Poempner’s leadership, dedication and\ncontributions to the Company and wishes him all the best for the future.\nDetails under Regulation 30 of Listing Regulations:\nSr. No. Particulars Details\n1. Name Mr. Alexander Poempner Mr. Ankit Nayyar\n2. Reason for To pursue new The Board of Directors, in their meeting\nchange opportunities held on September 15, 2026, approved the\nappointment of Mr. Nayyar as Group CFO\n& KMP of the Company.\n3. Date of Mr. Poempner will cease to be Mr. Nayyar will assume his new role with effect\nAppointment Group CFO & KMP wi siness hours on 30th September 2026\nBased on the recommendations of the Nomination and remuneration Committee, the Board of Directors at their\nmeeting held today considered and approved the Change in designation of Senior Management Personnel Mr.\nElango Srinivasan from Chief Financial Officer of the Company to “Special Projects Head - Finance” w.e.f. 01st\nOctober 2026. Consequent to this change Mr. Elango Srinivasan will cease to be the CFO of the Company from\nthe closure of business hours on 30th September 2026.\nA copy of the resignation letter is enclosed as Annexure B and the details required under Regulation 30 read with\nPara A of Part A of Schedule III of SEBI (Listing Obligations and Disclosure Requirements) Regulations, 2015 read\nwith SEBI circular No. SEBI/HO/49/14/14(7)2025-CFD-POD2/I/3762/2026 dated January 30, 2026, is enclosed as\nAnnexure C.", "2": "3. Appointment of Mr. Saravana Kumar M as the Chief Financial Officer and Senior Management Personnel\nof the Company w.e.f. 01st October 2026.\nBased on the recommendations of the Nomination and Remuneration Committee, the Board of Directors at their\nmeeting held today considered and approved the appointment of Mr. Saravana Kumar M as the Chief Financial\nOfficer and Senior Management Personnel of the Company w.e.f. 01st October 2026.\nThe details required under Regulation 30 read with Para A of Part A of Schedule III of SEBI (Listing Obligations and\nDisclosure Requirements) Regulations, 2015 read with SEBI circular No. SEBI/HO/49/14/14(7)2025-CFD-\nPOD2/I/3762/2026 dated January 30, 2026, is enclosed as Annexure D.\nThe meeting of the Board of Directors of the company commenced at 02:00 PM and concluded at 04:15 PM.\nA copy of this intimation is also being made available on the Company’s website at www.indianippon.com.\nWe request you to take the above information on record.\nYours sincerely\nFor India Nippon Electricals Limited\nDigitally signed\nS\nby S LOGITHA\nLOGITHADate: 2026.08.07\n18:31:1   for (const k of Object.keys(LABELS)) {
    if (!(k in d.fields) || (k === "successor_name" && d.fields[k] == null)) continue;
    const tr = el("tr");
    tr.appendChild(el("td", null, LABELS[k]));
    let val = d.fields[k]; if (k === "effective_date" && d.fields.effective_date_note) val = `${val} (${d.fields.effective_date_note})`;
    tr.appendChild(el("td", null, val == null ? "null" : String(val)));
    const ev = d.evidence[k]; const qtd = el("td");
    if (ev && ev.quote) { qtd.appendChild(el("span", "q", `“${ev.quote}”`)); qtd.appendChild(el("span", "pg", `  p${ev.page}`)); }
    else if (ev && ev.note) qtd.appendChild(el("span", "note", ev.note));
    else if (k === "role_level" || k === "practice") qtd.appendChild(el("span", "note", "Derived by rule (config/)"));
    if (ev && ev.note && ev.quote) qtd.appendChild(el("div", "note", ev.note));
    tr.appendChild(qtd);
    const v = d.verify[k]; const ctd = el("td");
    if (v) { ctd.appendChild(el("span", "chip " + v.status, v.status)); ctd.appendChild(el("div", "note", v.reason)); }
    tr.appendChild(ctd); t.appendChild(tr);
  }
  L.appendChild(t);
  if (d.context.length) {
    L.appendChild(el("h3", null, "Extra filed facts"));
    const ul = el("ul");
    d.context.forEach(c => { const li = el("li"); li.appendChild(el("strong", null, c.label + ": ")); li.appendChild(document.createTextNode(c.value + " ")); li.appendChild(el("span", "q", `“${c.quote}” `)); li.appendChild(el("span", "pg", "p" + c.page)); ul.appendChild(li); });
    L.appendChild(ul);
  }
  if (d.verify_v1_problems.length || d.corrections.length || d.flags.length) {
    L.appendChild(el("h3", null, "Audit trail"));
    d.verify_v1_problems.forEach(p => L.appendChild(el("div", "note flag", "Run 1 flagged: " + p)));
    d.corrections.forEach(c => L.appendChild(el("div", "note", `Corrected ${c.field}: ${c.reason}`)));
    d.flags.forEach(f => L.appendChild(el("div", "note flag", "Record flag: " + f)));
  }
  if (d.ai) {
    L.appendChild(el("h3", null, "AI second reader suggests"));
    const box = el("div", "ai");
    box.appendChild(el("div", "status " + (d.ai.decision === "VERIFIED" ? "v" : "r"), d.ai.decision));
    box.appendChild(el("div", null, d.ai.note || ""));
    (d.ai.overrides || []).forEach(o => box.appendChild(el("div", "note", `Override (${o.field}): ${o.reason}`)));
    L.appendChild(box);
  }
  L.appendChild(el("h3", null, "Your decision"));
  const mine = state[d.id] || {};
  const note = el("textarea"); note.placeholder = "Note (optional)"; note.value = mine.note || "";
  note.addEventListener("input", () => { if (state[d.id]) { state[d.id].note = note.value; save(); } });
  L.appendChild(note);
  const bar = el("div", "decide");
  const a = el("button", "btn approve", "Approve (A)"), r = el("button", "btn reject", "Reject (R)");
  a.onclick = () => decide("VERIFIED"); r.onclick = () => decide("REJECTED");
  bar.appendChild(a); bar.appendChild(r);
  bar.appendChild(el("span", "status " + (mine.decision === "VERIFIED" ? "v" : mine.decision === "REJECTED" ? "r" : ""),
    mine.decision ? `You: ${mine.decision}` : "Not decided"));
  L.appendChild(bar);

  R.appendChild(el("h3", null, "Source"));
  const link = el("a", null, `Open the filing PDF at page ${d.source_page} ↗`);
  link.href = d.source_url + "#page=" + d.source_page; link.target = "_blank"; link.rel = "noopener noreferrer";
  R.appendChild(link);
  R.appendChild(el("div", "note", d.source_url));
  const pages = Object.keys(d.pages).map(Number).sort((x, y) => x - y);
  pages.forEach(p => {
    R.appendChild(el("h3", null, `Page ${p} text (highlights = quotes)`));
    const box = el("div", "pagebox"); highlight(box, d.pages[p], d.quotes); R.appendChild(box);
  });

  function decide(dec) {
    state[d.id] = { decision: dec, note: note.value, at: new Date().toISOString() }; save();
    if (idx < view.length - 1) idx++; render();
  }
}

$("prev").onclick = () => { if (idx > 0) { idx--; render(); } };
$("next").onclick = () => { if (idx < view.length - 1) { idx++; render(); } };
$("filter").onchange = applyFilter;
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "a" || e.key === "A") document.querySelector(".approve")?.click();
  if (e.key === "r" || e.key === "R") document.querySelector(".reject")?.click();
});
$("export").onclick = () => {
  const who = $("who").value.trim() || "Human reviewer";
  const decisions = Object.entries(state).map(([id, s]) => ({ id, decision: s.decision, note: s.note || "", overrides: (DATA.find(d => d.id === id)?.ai?.overrides) || [] }));
  const blob = new Blob([JSON.stringify({ reviewer: who, reviewed_at: new Date().toISOString().slice(0, 10), decisions }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "review_decisions_human.json"; a.click();
};
$("import").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); (j.decisions || []).forEach(x => { state[x.id] = { decision: x.decision, note: x.note || "" }; }); save(); render(); }
  catch (err) { alert("Could not read that file."); }
};
render();
</script>
</body>
</html>
