se my skin to peel. After waxing, she did not apply any lotion either. Despite not using these products, she refused to hand them over, saying that only the wax had been used.\n\nThis raises a genuine concern: if the products were not used, why were they not handed over as promised in the app? The service did not match the expectations set by the platform.\n\nWhat I find particularly surprising is that this professional has a 4.8 rating on Yes Madam. After such a painful and disappointing experience, I genuinely question how accurately the ratings and reviews reflect the quality of service customers actually receive. I cannot say whether the reviews are genuine, but my personal experience was completely inconsistent with the rating.\n\nA professional beauty service should prioritise hygiene, proper technique, customer comfort, and skin safety—not rush through a booking. I paid for a professional service and ended up with an uneven eyebrow shape, an extremely painful waxing experience, and a scar that is still visible after 15 days.\n\nI would not recommend Yes Madam based on this experience. My first booking has left me extremely disappointed, and I have lost confidence in the quality control of the platform. I hope Yes Madam takes customer complaints seriously, investigates such incidents, and ensures that its professionals follow proper procedures and the product-handling policy mentioned in the app.","primary":"service_quality","subtag":"skin_injury_or_reaction","secondary":["product_fit"],"contacted":"no","failed":"no","severity":"high","churn":false,"service":"multiple","city":"","amount":0,"quote":"The waxing process was extremely harsh and painful, and my skin actually peeled off during the process."},{"n":51,"date":"2026-10-12","rating":3,"version":"18.9.0","title":"So so service","text":"Waxing is good but the so called korean facial and hydra facials are  of their of own company. I got pimples when i had o3 facial though i am regular user of O3+. And no re e offer for attractions","text":"They don’t give any free pedicure service offer I’ve tried it","primary":"price_clarity","subtag":"offer_not_honoured","secondary":[],"contacted":"no","failed":"no","severity":"low","churn":false,"service":"mani_pedi","city":"","amount":0,"quote":"They don’t give any free pedicure service offer I’ve tried it"},{"n":121,"date":"2026-09-28","rating":1,"version":"18.8.0","title":"Fake advertisements to attract customers","text":"This is one of the most frustrating promotional offers I’ve come across. I checked for the FREE pedicure offer for TWO DAYS continuously and waited until exactly 1 PM as instructed. Both days, the moment I checked, there were NO SLOTS AVAILABLE.\nThen what exactly is the point of advertising a “FREE” service and asking customers to wait until 1 PM if there are apparently no slots available?\nThis genuinely feels like a marketing tactic to attract people, make them download the app, and create excitement around an offer that customers are unable to actually redeem. I wasted my time for two consecutive days following the instructions exactly as given.\nIf there are only a handful of slots, clearly state the number of slots and eligibility instead of making it look like a genuine free service available to customers.\nVery misleading and extremely disappointing. Please don’t advertise offers in a way that makes customers repeatedly waste their time trying to claim something that is practically unavailable.","primary":"price_clarity","subtag":"offer_not_honoured","secondary":["app"],"contacted":"no","failed":"no","severity":"low","churn":false,"service":"mani_pedi","city":"","amount":0,"quote":"I checked for the FREE pedicure offer for TWO DAYS continuously and waited until exactly 1 PM as instructed."},{"n":122,"date":"2026-09-28","rating":3,"version":"18.8.0","title":"Irritating False notifications","text":"Good app and service. But it keeps sending false notifications to trigger fomo, where they mention that 400/- al_cleanup","city":"","amount":0,"quote":"[name] is amazing at her work. I loved her work and she is very kind and humble."},{"n":166,"date":"2026-09-20","rating":1,"version":"18.8.0","title":"Service","text":"I added this app via referal code in which mani pedi was free, then screen came mani pedi will start live after 50 mins when it is started written it is sold out - Are customers dumb? Worst app I have ever seen, I will try my best no one will install.","primary":"price_clarity","subtag":"offer_not_honoured","secondary":[],"contacted":"no","failed":"no","severity":"low","churn":false,"service":"mani_pedi","city":"","amount":0,"quote":"mani pedi will start live after 50 mins when it is started written it is sold out"},{"n":167,"date":"2026-09-20","rating":3,"version":"18.8.0","title":"Good service but their offers are a scam","text":"Every now and then they put out free service offers and even when slots are not filled the booking does not get completed. Today they have started free pedicure services. I have not found one customer getting these free services and trust me I know many!","primary":"price_clarity","subtag":"offer_not_honoured","secondary":["app"],"contacted":"no","failed":"no","severity":"low","churn":false,"service":"mani_pedi","city":"","amount":0,"quote":"Every now and then they put out free service offers and even when slots are not filled the booking does not get completed."},{"n":168,"date":"2026-09-19","rating":1,"version":"18.8.0","title":"Lacks transparency","text":"I had booked a Deep Tissue Healing Massage along with a Head & Face Massage through the app. At the time of booking, the app clearly mentioned that hygiene items including disposables, bed covers and a Luxe Foot Ritual were provided as part of the service.\n\nAt no point during the booking process, Prime booking confirmation, or slot confirmation was I informed that I would have to pay separately for these basic amenities. However, just before starting the session, the masseuse informed me that I needed to purchase the foot salt and disposables separately.\n\nThis is extremely disappointing and feels like a lack of transparency. If these items are not actually included in the service, the customer should be clearly informed about the additional charges BEFORE confirming and paying for the booking—not at the time of the session.\n\nCustomers should be able to make an informed decision about what they are paying for. You need to be upfront and transparent about what is included and what is chargeable separately.\n\nI am deeply disappointed with this experience and would like you to clarify why these charges were not disclosed at the time of booking and what resolution you can offer.","primary":"price_clarity","subtag":"hidden_charges","secondary":["product_fit"],"contacted":"no","failed":"no","severity":"medium","churn":false,"service":"massage_spa","city":"","amount":0,"quote":"just before starting the session, the masseuse informed me that I needed to purchase the foot salt and disposables separately."},{"n":169,"date":"2026-09-19","rating":1,"version":"18.8.0","title":"Extremely disappointing experience — poor service and even poorer customer support","text":"My experience with Yes Madam this time was extremely disappointing, and unfortunately, almost every aspect of the service went wrong.\n\nFirstly, the expert arrived late despite me confirming the booking and my complete address about an hour before the scheduled service. She told me that the app was showing a different location. The app had apparently picked up a different location automatically, even though I had entered my complete and correct address in the booking. Instead of acknowledging the issue with the app, the expert repeatedly blamed me for the incorrect location. I had not selected that location myself, so it was extremely frustrating to be made responsible for something I had no control over.\n\nOnce she arrived, she decided the sequence of services herself. She started with waxing and then proceeded with the pedicure. By the time the pedicure was completed, she was already in a rush. As a result, one of my booked services — threading — was completely missed.\n\nShe also left the garbage packet behind without informing me. When I asked what I was supposed to do with it, she told me that I was supposed to throw it away. This has never been my experience with Yes Madam earlier. Previously, experts either asked me how the waste should be disposed of or disposed of it themselves in the dustbin that was already available in the bathroom.\n\nAnother issue was the leftover product. When I asked for the leftover product, I was told that it would only be handed over if I had booked both manicure and pedicure, and otherwise she was not supposed to give it to me. This was confusing because Yes Madam promotes its products as being exclusively for the service and single-use. If the product is genuinely meant for one-time use, I fail to understand why the leftover product was simply taken away instead of being handled transparently.\n\nThe most disappointing part was that the expert left without completing the service. She was asking for the OTP while leaving, and I was so confused by the rush that I didn’t immediately realise that threading had been missed. I called her 3–4 times immediately afterwards, but she did not answer. I even contacted my society’s guard room and was told that she had not yet left the society. Despite being there, she did not respond to my calls.\n\nI subsequently contacted customer care and explained the entire situation. I expected them to arrange the missed service, even if it had to be done later that day or the next day. I was flexible about the timing. Instead, I was told that the amount would be credited to my Yes Madam wallet/cash balance, which could only be used when I booked another service worth ₹500 or more.\n\nThis was extremely disappointing. I had paid for a service that was not completed, and instead of arranging the pending service or providing an appropriate resolution, I was essentially told to spend more money with the company in order to use the amount I had already paid.\n\nWhat disappointed me most was the complete lack of accountability. The location issue was blamed on me. The missed service was effectively my responsibility because I apparently should have remembered everything that had to be done. The expert’s rush and incomplete service were not adequately addressed. And customer care did not provide a meaningful solution either.\n\nAs a customer, I should not have to manage the expert’s timing, remind her about the services I have already booked, ensure that she doesn’t leave before completing them, and then chase her after she leaves.\n\nI have used Yes Madam services before and had much better experiences, which is why this experience was particularly disappointing. This time, it felt as though the priority was simply to complete the payment and close the booking rather than actually ensure that the customer received the service that was paid for.\n\nI hope Yes Madam seriously reviews this incident, the expert’s conduct, the handling of the booking/location issue, and the customer-care resolution process. A customer should not be made responsible for problems caused by the app, nor should they have to bear the loss when a booked service is left incomplete.","primary":"service_quality","subtag":"rushed_or_incomplete","secondary":["delay","app","payment_refund","support","product_fit"],"contacted":"yes","failed":"yes","severity":"medium","churn":false,"service":"multiple","city":"","amount":500,"quote":"she was already in a rush. As a result, one of my booked services — threading — was completely missed."},{"n":170,"date":"2026-09-19","rating":5,"version":"18.8.0","title":"Massages","text":"Very good","primary":"praise","subtag":"praise_service","secondary":[],"contacted":"no","failed":"no","severity":"none","churn":false,"service":"massage_spa","cit "text":"Thanks [name] for the professional service, never thought parlour at home would be this smooth. Would recommend for all.","primary":"praise","subtag":"praise_professional","secondary":[],"contacted":"no","failed":"no","severity":"none","churn":false,"service":"unknown","city":"","amount":0,"quote":"Thanks [name] for the professional service, never thought parlour at home would be this smooth."},{"n":500,"date":"2026-06-18","rating":5,"version":"18.2.0","title":"Pedicure nd facial","text":"Good service.. [name] are just awesome, very professional. was so cooperative & helpful. I’ll surely recommend to my friends too.","primary":"praise","subtag":"praise_professional","secondary":[],"contacted":"no","failed":"no","severity":"none","churn":false,"service":"multiple","city":"","amount":0,"quote":"[name] are just awesome, very professional. was so cooperative & helpful."}],"uc":{"n":500,"tagged":500,"nC":301,"store_avg":4.77,"store_ratings":1223305,"byPrimary":{"partner_cancellation":74,"service_quality":55,"other":44,"support":23,"delay":5,"price_clarity":49,"payment_refund":27,"product_fit":8,"app":16},"contacted":103,"churn":36,"high":66,"oneStar":212,"subs":{"no_show":13,"poor_skill":28,"repeated_reschedule":13,"other_issue":34,"unhelpful_or_scripted":15,"unclear":10,"no_partner_available":8,"rushed_or_incomplete":9,"last_minute_cancel":40,"rude_behaviour":8,"late_arrival":3,"hidden_charges":16,"safety_or_theft":6,"charged_not_served":19,"unreachable":6,"price_mismatch":20,"product_quality":7,"offer_not_honoured":6,"other_app":7,"refund_denied":6,"slots_unavailable":2,"hygiene":3,"slow_assignment":2,"membership_or_package_confusion":7,"booking_or_checkout_bug":5,"crash_or_wont_open":2,"product_upsell":1,"no_escalation":1,"slow_resolution":1,"refund_delayed":2,"skin_injury_or_reaction":1},"from":"2026-09-10","to":"2026-10-21"},"reliability":{"n":500,"agree":492,"po":0.984,"kappa":0.9791524425519494,"adjudicated":8,"by_batch":[{"b":1,"po":0.99,"kappa":0.9872188139059305},{"b":2,"po":0.97,"kappa":0.9630996309963099},{"b":3,"po":0.98,"kappa":0.9732262382864793},{"b":4,"po":0.99,"kappa":0.9860002799944001},{"b":5,"po":0.99,"kappa":0.98568770573923}]},"impact":{"defaults":{"bookings":350000,"contactRate":12,"costPerContact":45,"reduction":30,"lostShare":10,"annualValue":5400},"churnTop3":0.16470588235294117},"story":{"top3":["partner_cancellation","price_clarity","service_quality"],"order":["partner_cancellation","price_clarity","service_quality","product_fit","app","payment_refund","support","delay","other"],"t1":"59% of complaints come down to three things: no-shows and cancellations, price and offer clarity and service quality.","t2":"No-shows and cancellations lead, at 20% of complaints. Customers don't just dislike them; many have already called support about them.","t3":"Each driver traces back to something the operation controls, not something customers do.","t4":"If tickets look like reviews, the top three drivers are most of the support load, and the bigger cost is customers who don't come back.","t5":"Three fixes, one per driver, each with an owner, a metric and a target. One number tracks the programme: contacts per 100 bookings.","tR":"Why customers contact Yes Madam, and what to fix first.","tB":"Same top drivers as Urban Company, but Yes Madam over-indexes on products.","tC":"Complaints by month and by app version.","paretoNote":"<b>72 complaints (25%)</b> say they already contacted support, and 63 of them say support didn't fix it. Among those 72, the top three drivers account for 51 (71%), and no-shows and cancellations alone for 26 (36%).","quotes":{"partner_cancellation":[{"n":338,"rating":1,"date":"2026-08-02","text":"I booked a service for 4:30 PM today, and instead of informing me beforehand, they called me at exactly 4:30 PM to say that no professional was available","tag":null},{"n":219,"rating":1,"date":"2026-09-05","text":"professional refused to come and asked me to cancel and when I told her u cancel she kept calling me till I cancelled it.","tag":null},{"n":26,"rating":1,"date":"2026-10-16","text":"Twice professionals didn’t show up. No cancellations, no notice, just plain didn’t show up.","tag":null}],"price_clarity":[{"n":78,"rating":3,"date":"2026-10-09","text":"The first 2 days the slots were already over by 1:02 pm.","tag":null},{"n":10,"rating":2,"date":"2026-10-19","text":"If I’m booking a spa for 970 it sums up to 1399 by the end of the payment","tag":null},{"n":55,"rating":2,"date":"2026-10-11","text":"while booking I get to know there are platform charges, mandatory disposable kit charges which resulted me to pay extra amount unnecessarily.","tag":null}],"service_quality":[{"n":41,"rating":1,"date":"2026-10-13","text":"I got burned on my hand after my waxing, and customer support said they'd give me a 400 free coupon. What do I do with my hand now?","tag":null},{"n":152,"rating":1,"date":"2026-09-22","text":"One knocked off a good part of my eyebrow I was hoping that’s a basic skill but guess not.","tag":null},{"n":264,"rating":1,"date":"2026-08-23","text":"Professional was in too much hurry, and didn’t do the work properly. I got rashes and skin irritation.","tag":null}]},"whys":[{"driver":"partner_cancellation","problem":"Bookings fail at or after the slot time, and the customer is the last to know.","chain":[{"text":"The assigned professional declined, went on leave or fell ill, and no one else was sent (#62, #247, #250).","ev":"E"},{"text":"Nobody checks before the slot that she is coming. The customer finds out at the slot time, or only when she calls support (#15, #193, #338).","ev":"E"},{"text":"Accepting a job does not lock the professional in: some call and ask the customer to cancel instead (#127, #219, #362).","ev":"E"},{"text":"The app shows slots when no professional is free, and products run short too, so there is no one ready to send instead (#73, #284, #394).","ev":"E"},{"text":"Slots are sold off the calendar, not off confirmed professional capacity in that area and hour, and payment is taken before anyone confirms.","ev":"H"}],"root":"Slots are sold before a professional is confirmed, and nothing checks or backfills a dropped job before the slot time.","test":"If most failed bookings had a professional confirmed 2 hours before the slot and still failed, the problem is on-the-day behaviour, not slot inventory."},{"driver":"price_clarity","problem":"Customers feel tricked: the free offer is gone in a minute, and the price grows at checkout.","chain":[{"text":"The offer they were sent could not be booked, or the final price was higher than the price shown (#10, #23).","ev":"E"},{"text":"The free pedicure opens at 1 pm for everyone. Slots are gone by 1:02, and the app crashes at checkout in the rush (#78, #121, #138).","ev":"E"},{"text":"It reads as a scam, not a sell-out: customers call it 'fake' and 'bluffing', and nothing tells them how few slots there were (#48, #77, #121).","ev":"E"},{"text":"Compulsory fees sit outside the listed price: a platform fee, a ₹99 kit charge, a ₹300 line labelled tax. They appear only at checkout (#55, #126, #190).","ev":"E"},{"text":"Offers and price pages are judged on installs and visits, not on how many offers are honoured or how many complaints they create.","ev":"H"}],"root":"Offers and prices are built to attract, not to be honoured: a flash offer that sells out in minutes is pushed to everyone, and compulsory fees show up only at checkout.","test":"If offer complaints spike only on days the app crashed at 1 pm, this is an engineering capacity problem, not offer design."},{"driver":"service_quality","problem":"The service itself goes wrong: untrained or rushed work, rude behaviour, and burns or rashes (11 of the 24 burn or reaction reviews follow waxing).","chain":[{"text":"The professional lacked the skill for that service: burnt skin after waxing, ruined brows (#41, #152, #191).","ev":"E"},{"text":"Professionals reach customers before their skill on each service is proven. Quality is checked by ratings after the job, not before it.","ev":"H"},{"text":"Professionals rush the job: 'in too much hurry', a facial done in 30 minutes (#50, #264, #351).","ev":"E"},{"text":"When something goes wrong, there is no real follow-up: a ₹400 coupon for a burnt hand, no reply to photos of a burn, a promised refund that never came (#41, #217, #104).","ev":"E"},{"text":"Complaints are closed case by case in support and don't flow back to the professional's record, training or assignment.","ev":"H"}],"root":"No closed loop from complaint to professional: skill isn't certified per service before risky jobs like waxing, and complaints end in coupons instead of retraining.","test":"If complaints are spread evenly across professionals rather than concentrated in a few, the problem is training content or products, not specific people."}],"fixes":[{"driver":"partner_cancellation","name":"Confirm or reassign 2 hours before","owner":"City Ops, Supply and Product","what":"Professional confirms 2 hours before the slot. No confirmation means auto-reassign from the nearby pool, and the customer gets a message with a choice before the slot, not after. Sell slots only against confirmed capacity. Log a professional's 'please cancel' as a partner cancellation.","metric":"Failed bookings per 100, partner side","target":"Down 40% in 8 weeks; 90% of failures with 2+ hours' notice","measure":"Pilot in 2 cities against 2 similar cities for 4 weeks. Track failed bookings, notice given, reassign success, and contacts per 100 bookings for 'where is my professional'."},{"driver":"price_clarity","name":"Price shown is price paid; honest offers","owner":"Growth, Product and Finance","what":"Show compulsory fees inside the listed price. Label flash offers with the number of slots ('200 free pedicures today') and give a waitlist or coupon when they run out. Load-test the 1 pm checkout.","metric":"Offer and price complaints per 1,000 bookings","target":"Down 50%, with checkout conversion flat or better","measure":"A/B test all-in prices on 10% of users for 2 weeks: conversion, cart-to-payment drop-off, and contacts tagged offer or charges. Track app crashes in the 1 pm window."},{"driver":"service_quality","name":"Certify risky services; close the loop on complaints","owner":"Training & QA and CX","what":"Certify each professional per service, waxing first, before she is assigned it. Every injury complaint gets a call within 24 hours, care for the customer, and the professional is paused and retrained. Weekly list of professionals with 2+ complaints.","metric":"Injury and quality complaints per 1,000 jobs","target":"Down 30% in 12 weeks; no repeat complaint within 30 days of retraining","measure":"Before and after by hub cohort. Check how concentrated complaints are: if the worst 10% of professionals carry most of them, target them first."}],"plan30":["Week 1: pull the last 90 days of support tickets and tag them with this codebook. Compare the ticket mix with this review mix.","Week 2: put rupees on each driver from real data: contacts, refunds, compensation coupons and lost repeat bookings.","Week 3: start the two pilots: confirm-or-reassign in 2 cities, and all-in prices for 10% of users.","Week 4: first readout to you, and a weekly contacts-per-100-bookings view by driver."],"northStarNote":"It falls only if customers have fewer reasons to call, which is the point. Watch first-contact resolution next to it, so contacts aren't cut by making support harder to reach.","readout":{"problem":["Customers who write reviews are mostly unhappy: 58% of the 500 most recent App Store reviews are complaints and 45% are 1★, against a 4.73★ store average.","59% of complaints come from three drivers: no-shows and cancellations (20%), price and offer clarity (19%) and service quality (19%).","25% of complaints say they already contacted support, and the same three drivers are 71% of those; no-shows and cancellations alone are 36%. 13% say they will stop using the app."],"root":["Slots are sold before a professional is confirmed, and nothing checks or backfills a dropped job before the slot time.","Offers and prices are built to attract, not to be honoured: a flash offer that sells out in minutes is pushed to everyone, and compulsory fees show up only at checkout.","No closed loop from complaint to professional: skill isn't certified per service before risky jobs like waxing, and complaints end in coupons instead of retraining."],"impact":["At about 3.5 lakh bookings a month and an assumed 12 contacts per 100 bookings, that is about 42,000 contacts a month.","The top three drivers would be about 59% of them, about 24,800 a month. A 30% cut removes about 7,400 contacts a month, or ₹40.2 L a year at ₹45 a contact.","The bigger prize is retention: if 1 in 10 customers behind those bad experiences would otherwise leave, keeping them is worth up to ₹4.8 Cr a year at ₹5,400 a customer."],"action":["Confirm or reassign 2 hours before: failed bookings per 100, partner side, down 40% in 8 weeks; 90% of failures with 2+ hours' notice.","Price shown is price paid; honest offers: offer and price complaints per 1,000 bookings, down 50%, with checkout conversion flat or better.","Certify risky services; close the loop on complaints: injury and quality complaints per 1,000 jobs, down 30% in 12 weeks; no repeat complaint within 30 days of retraining."],"caveat":"Based on 500 public App Store reviews, which skew negative and towards iPhone users, and are not ticket data. Use them for the mix of problems; confirm the size with support tickets in week 1."},"biases":[{"what":"Negativity.","effect":"People write when upset: 45% of written reviews are 1★, against a 4.73★ store average. Use the mix of problems, not the rate."},{"what":"iPhone only.","effect":"App Store reviewers skew metro and higher income. Android is most of the base; a hand-copied Play Store sample would check the mix."},{"what":"Campaign spikes.","effect":"One offer campaign can flood reviews for weeks. Check the month view before calling it structural."},{"what":"Not tickets.","effect":"Most contacts never become reviews, and quick 'where is my professional' calls rarely do. The ticket mix will differ."},{"what":"Self-reported.","effect":"Claims such as theft or injury are allegations, not verified facts. They are counted, not judged."}],"benchNotes":["<b>Same pain, different weights.</b> Urban Company's top three are no-shows and cancellations, service quality, price and offer clarity. Overlap with Yes Madam's top three: 3 of 3.","<b>Yes Madam over-indexes on products</b>: 10% of complaints vs 3% at Urban Company (+8 pts).","<b>Yes Madam under-indexes on support</b>: 2% vs 8% (-6 pts).","Both apps: over 4 in 10 written reviews are 1★ (45% Yes Madam, 42% Urban Company), against store averages of 4.73★ and 4.77★. Reviews skew negative everywhere."],"monthNote":"Offer complaints ('offer or coupon not honoured') peak in Sep (19 reviews). The free-pedicure campaign alone is 17 of the 56 price and offer complaints (13 Sep to 17 Oct). Take it out and price and offers still rank #3.","freePedicure":{"n":17,"first":"2026-09-13","last":"2026-10-17","rank_without":3},"contactWeighted":{"top3":0.7083333333333334,"lead":"partner_cancellation","leadShare":0.3611111111111111},"versionNote":"<b>Version 18.9.0</b> has the most app complaints (10 of 87 reviews on it). 29 reviews in all are about the app itself: a release-quality question for tech, not an ops one.","jd":[["Root cause analysis","Five whys on each top driver, with evidence vs hypothesis marked and a test that would prove each one wrong","LVX: funnel analysis across ₹3.5 Cr, ₹7 Cr and ₹9 Cr+ launches; found where investors stalled; conversion up 20%"],["Complaint reduction","Three fixes with an owner, one metric, a target and a pilot design","Techvaraha: 4 SOPs, QA workflows and KRAs; on-time delivery from 65% to 90%; zero missed deliverables for 3 quarters"],["Lower contact rates","Contacts per 100 bookings as the one metric; an impact model in contacts and rupees","Techvaraha: escalation turnaround down 40% with one tracker and a review rhythm"],["Crisp narrative","Five slides, three minutes, and a one-page readout: problem, root cause, impact, action","Techvaraha: 15+ executive presentations"],["Leadership presentations","A readout written for a VP decision, with the bias said out loud","LVX: dashboards for the founder and management tracking ₹7 Cr+ of pipeline; reporting accuracy up 30%"],["Clean, trustworthy data","Two independent taggers, agreement and kappa measured, names and IDs removed","LVX: reporting SOPs and data workflows; manual errors down 35%"],["Supply-side ops","No-show root cause traced to slot inventory vs confirmed capacity","Built a network of 1,400+ healthcare practitioners and 15+ hospital tie-ups"]]}};</script>
<script>
(() => {
"use strict";
const D = DATA, S = D.story, M = D.meta;
const R = D.reviews;

/* ---------- format ---------- */
const MINUS = "−";
const nf = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
const fInt = n => nf.format(Math.round(n));
const fPct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const fRs = r => r >= 1e7 ? "₹" + (r / 1e7).toFixed(2) + " Cr" : r >= 1e5 ? "₹" + (r / 1e5).toFixed(1) + " L" : "₹" + fInt(r);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stars = n => `<span class="stars" aria-label="${n} stars">${"★".repeat(n)}<span class="muted">${"★".repeat(5 - n)}</span></span>`;
const dfmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const DRV = D.drivers;                       // key -> {label, short, desc}
const SUB = D.subtags;                       // key -> label
const label = k => (DRV[k] ? DRV[k].label : k);

/* ---------- derived numbers ---------- */
const complaints = R.filter(r => r.primary !== "praise");
const nC = complaints.length;
const byPrimary = {};
for (const r of complaints) byPrimary[r.primary] = (byPrimary[r.primary] || 0) + 1;
const order = Object.keys(byPrimary).sort((a, b) => (b === "other") - (a === "other") || byPrimary[b] - byPrimary[a] || S.order.indexOf(a) - S.order.indexOf(b));  // ties: the build order
const ranked = order.filter(k => k !== "other").concat(order.includes("other") ? ["other"] : []);
const TOP = S.top3;                          // decided in the build from the data
const mentions = {};
for (const r of complaints) for (const k of new Set([r.primary].concat(r.secondary || []))) if (k !== "praise") mentions[k] = (mentions[k] || 0) + 1;
const contacted = complaints.filter(r => r.contacted === "yes");
const failed = contacted.filter(r => r.failed === "yes");
const churn = complaints.filter(r => r.churn);
const high = complaints.filter(r => r.severity === "high");
const oneStar = R.filter(r => r.rating === 1).length;
const top3n = TOP.reduce((s, k) => s + (byPrimary[k] || 0), 0);
const contactedBy = {};
for (const r of contacted) contactedBy[r.primary] = (contactedBy[r.primary] || 0) + 1;
const top3c = TOP.reduce((s, k) => s + (contactedBy[k] || 0), 0);
const sharePrimary = k => (byPrimary[k] || 0) / nC;

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(e, title, rows) {
  tip.replaceChildren();
  if (title) { const t = document.createElement("div"); t.className = "tt"; t.textContent = title; tip.append(t); }
  for (const r of rows) {
    const row = document.createElement("div"); row.className = "tr";
    const k = document.createElement("span"); k.className = "k"; k.textContent = r.k;
    const v = document.createElement("span"); v.className = "v"; v.textContent = r.v;
    row.append(k, v); tip.append(row);
  }
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = e.clientX + 14, top = e.clientY + 14;
  if (left + w > innerWidth - 8) left = e.clientX - w - 14;
  if (top + h > innerHeight - 8) top = e.clientY - h - 14;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { tip.style.display = "none"; }
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    const d = JSON.parse(el.dataset.tip);
    const on = e => showTip(e.clientX ? e : (() => { const r = el.getBoundingClientRect(); return { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }; })(), d.t, d.r);
    el.addEventListener("pointermove", on); el.addEventListener("focus", on);
    el.addEventListener("pointerleave", hideTip); el.addEventListener("blur", hideTip);
  });
}
const tipAttr = (t, r) => `data-tip='${esc(JSON.stringify({ t, r }))}' tabindex="0"`;

/* ---------- theme ---------- */
const darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function isDark() { const t = document.documentElement.dataset.theme; return t === "dark" || (t !== "light" && !!(darkQuery && darkQuery.matches)); }
function pal() {
  return isDark()
    ? { accent: "#3987e5", s2: "#d95926", gray: "#4a4f4c", soft: "#1f4a7d", ink: "#eef0ee", muted: "#939a96", surface: "#181a19", grid: "#2a2d2c" }
    : { accent: "#2a78d6", s2: "#eb6834", gray: "#c9ccc8", soft: "#b9cfe9", ink: "#0e1110", muted: "#78807c", surface: "#ffffff", grid: "#e4e7e4" };
}

/* ---------- charts ---------- */
function niceTicks(max, count = 4) {
  const step0 = (max || 1) / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const t = []; for (let v = 0; v <= max + step * 0.01; v += step) t.push(+v.toFixed(10));
  if (t[t.length - 1] < max) t.push(t[t.length - 1] + step);
  return t;
}
/* grouped vertical columns: categories x series, one axis */
function groupedColumns(el, o) {
  const P = pal();
  const W = Math.max(300, el.clientWidth), H = o.height || 220, m = { l: 36, r: 8, t: 14, b: 40 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = o.cats.length, ns = o.series.length, band = iw / n, bw = Math.min(20, (band * 0.7) / ns);
  const vmax = Math.max(...o.series.flatMap(s => s.values)) * 1.12;
  const ticks = niceTicks(vmax, 4), top = ticks[ticks.length - 1];
  const y = v => m.t + ih - v / top * ih;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}">`;
  for (const t of ticks) s += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${esc(o.yFmt(t))}</text>`;
  o.cats.forEach((c, i) => {
    const cx = m.l + band * i + band / 2, gw = bw * ns + 2 * (ns - 1);
    o.series.forEach((se, j) => {
      const v = se.values[i], x = cx - gw / 2 + j * (bw + 2), top0 = y(v), h = m.t + ih - top0;
      if (h > 0.5) s += `<path d="M${x} ${m.t + ih} v${-Math.max(0, h - 3)} a3 3 0 0 1 3 -3 h${bw - 6} a3 3 0 0 1 3 3 v${Math.max(0, h - 3)} Z" style="fill:${se.color}"/>`;
    });
    const lab = o.catLabel(c);
    lab.split("\n").forEach((ln, k) => { s += `<text class="ax" x="${cx}" y="${H - 26 + k * 12}" text-anchor="middle">${esc(ln)}</text>`; });
    s += `<rect x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" ${tipAttr(o.catLabel(c).replace("\n", " "), o.series.map(se => ({ k: se.name, v: o.yFmt(se.values[i]) })))}/>`;
  });
  s += `<line class="bl" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/></svg>`;
  el.innerHTML = s; bindTips(el);
}
/* stacked columns by month */
function stackedColumns(el, o) {
  const P = pal();
  const W = Math.max(300, el.clientWidth), H = o.height || 200, m = { l: 32, r: 8, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.cats.length, band = iw / n, bw = Math.min(46, band * 0.6);
  const totals = o.cats.map((_, i) => o.series.reduce((a, s) => a + s.values[i], 0));
  const ticks = niceTicks(Math.max(...totals) * 1.08, 4), top = ticks[ticks.length - 1];
  const y = v => m.t + ih - v / top * ih;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}">`;
  for (const t of ticks) s += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  o.cats.forEach((c, i) => {
    const cx = m.l + band * i + band / 2; let acc = 0;
    o.series.forEach(se => {
      const v = se.values[i]; if (!v) return;
      const y1 = y(acc + v), y0 = y(acc); acc += v;
      s += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - 2)}" style="fill:${se.color}"/>`;
    });
    s += `<text class="lbl-ink" x="${cx}" y="${y(totals[i]) - 4}" text-anchor="middle">${totals[i]}</text>`;
    s += `<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${esc(c)}</text>`;
    s += `<rect x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" ${tipAttr(c, o.series.map(se => ({ k: se.name, v: String(se.values[i]) })).concat([{ k: "Total", v: String(totals[i]) }]))}/>`;
  });
  s += `<line class="bl" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/></svg>`;
  el.innerHTML = s; bindTips(el);
}

    return head("One-page readout", S.tR, "", `${esc(M.app)} · ${fInt(M.n)} App Store reviews`) +
      `<div class="readout">
        <div class="card"><h3>Problem</h3>${r.problem.map(p => `<p style="margin:4px 0">${esc(p)}</p>`).join("")}</div>
        <div class="card"><h3>Likely root cause</h3><ul>${r.root.map(p => `<li>${esc(p)}</li>`).join("")}</ul><p class="muted" style="margin:6px 0 0;font-size:12.5px">From the five whys. Parts marked "to verify" on slide 3 need ticket and ops data in week 1.</p></div>
        <div class="card"><h3>Impact</h3><ul>${r.impact.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
        <div class="card"><h3>Action</h3><ol>${r.action.map(p => `<li>${esc(p)}</li>`).join("")}</ol></div>

  },
});

/* A · Method and bias */
SLIDES.push({

    const rel = D.reliability;
    const code = Object.entries(DRV).filter(([k]) => k !== "praise").map(([k, v]) => `<tr><td class="strong nowrap">${esc(v.label)}</td><td class="ink2">${esc(v.desc)}</td></tr>`).join("");
    return head("A · Method and bias", "How the 500 reviews were read, tagged and checked, and what they can't tell us.", "", "") +
      `<div class="grid">
        <div class="stack c4">
          <div class="card"><p class="card-t" style="margin-bottom:6px">Source</p><dl class="kv">
            <dt>Where</dt><dd>${esc(M.source_long)}</dd>
            <dt>Which</dt><dd>The ${fInt(M.n)} most recent reviews (the feed's maximum), ${esc(dfmt(M.from))} – ${esc(dfmt(M.to))} ${esc(M.to.slice(0, 4))}</dd>
            <dt>Why not Play Store</dt><dd>${esc(M.playNote)}</dd>
            <dt>Privacy</dt><dd>Reviewer names dropped. Names of professionals and order IDs inside reviews replaced with [name] and [id].</dd>
          </dl></div>
          <div class="card"><p class="card-t" style="margin-bottom:6px">Tagging, double-checked</p>
            <p style="margin:0;font-size:13px">One codebook, built on the eight drivers in the brief. All ${fInt(rel.n)} reviews were tagged twice with it, in two independent AI-assisted passes. The passes agreed on the primary driver for <b>${fPct(rel.po)}</b> (Cohen's kappa <b>${rel.kappa.toFixed(2)}</b>). A third read against the codebook settled the ${fInt(rel.adjudicated)} disagreements, and every quote was checked word for word against its review.</p></div>
        </div>
        <div class="card c4"><p class="card-t" style="margin-bottom:6px">Bias, said out loud</p>
          ${S.biases.map(b => `<div class="callout warn"><b>${esc(b.what)}</b> ${esc(b.effect)}</div>`).join("")}
        </div>
        <div class="card c4"><p class="card-t" style="margin-bottom:6px">Codebook</p><div class="tbl-wrap"><table class="tbl"><tbody>${code}</tbody></table></div>
          <p class="card-s" style="margin-top:8px">Rule: support is the driver only when support itself is the whole complaint. Otherwise the underlying problem is the driver and support is secondary.</p></div>
      </div>` + foot("Appendix A");
  },
});

/* B · Benchmark vs Urban Company */
SLIDES.push({
  id: "benchmark", tab: "vs UC", n: "B",
  html() {
    const U = D.uc;
    const keys = ranked.filter(k => k !== "other");

    }).join("");
    return head("B · Benchmark: Urban Company", S.tB, `Same method, ${fInt(U.n)} most recent Urban Company App Store reviews (${esc(dfmt(U.from))} – ${esc(dfmt(U.to))}). Urban Company covers all home services, so salon issues are only part of its mix.`, "") +
      `<div class="grid">
        <div class="card c7"><div class="card-h"><div><p class="card-t">Share of complaints by driver</p></div></div><div class="chart" id="ch-bench"></div>
          <div class="legend"><span><i class="key-rect" id="k1"></i>${esc(M.app)}</span><span><i class="key-rect" id="k2"></i>Urban Company</span></div></div>
        <div class="stack c5">
          <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Driver</th><th class="num">${esc(M.app)}</th><th class="num">Urban Co.</th><th class="num">Gap</th></tr></thead><tbody>${rows}</tbody></table></div></div>
          <div class="card">${S.benchNotes.map(t => `<div class="callout">${t}</div>`).join("")}</div>
        </div>
      </div>` + foot("Appendix B");
  },
  charts() {
    const P = pal(), U = D.uc, keys = ranked.filter(k => k !== "other");
    document.getElementById("k1").style.background = P.accent; document.getElementById("k2").style.background = P.s2;
    groupedColumns(document.getElementById("ch-bench"), {
      cats: keys, catLabel: k => DRV[k].short.replace(" & ", "\n& ").replace(" / ", "\n/ "), height: 300,
      series: [{ name: M.app, values: keys.map(k => sharePrimary(k) * 100), color: P.accent }, { name: "Urban Company", values: keys.map(k => (U.byPrimary[k] || 0) / U.nC * 100), color: P.s2 }],
      yFmt: v => v.toFixed(0) + "%", aria: "Share of complaints by driver, Yes Madam vs Urban Company",
    });
  },
});

/* C · Trends */
SLIDES.push({
  id: "trends", tab: "Trends", n: "C",
  html() {
    return head("C · Trends", S.tC, "Complaint reviews by month and driver, and app complaints by app version.", "") +
      `<div class="grid">
        <div class="card c7"><div class="card-h"><div><p class="card-t">Complaints by month</p><p class="card-s">Top 3 drivers in colour, the rest in gray. ${esc(S.monthNote)}</p></div></div><div class="chart" id="ch-month"></div><div class="legend" id="lg-month"></div></div>
        <div class="card c5"><div class="card-h"><div><p class="card-t">App complaints by version</p><p class="card-s">Reviews tagged "App", by the version the reviewer was on.</p></div></div><div class="tbl-wrap"><table class="tbl" id="verTbl"></table></div>
          <div class="callout mt">${S.versionNote}</div></div>
      </div>` + foot("Appendix C");
  },
  charts() {
    const P = pal();
    const months = [...new Set(R.map(r => r.date.slice(0, 7)))].sort();
    const mlab = m => new Date(m + "-01T00:00:00").toLocaleDateString("en-GB", { month: "short" }) + (m === months[0] ? " (part)" : m === months[months.length - 1] ? " (to " + M.to.slice(8, 10) + ")" : "");
    const colors = [P.accent, P.s2, "#1baf7a"];
    const series = TOP.map((k, i) => ({ name: DRV[k].short, color: colors[i], values: months.map(m => complaints.filter(r => r.primary === k && r.date.startsWith(m)).length) }));
    series.push({ name: "Everything else", color: P.gray, values: months.map(m => complaints.filter(r => !TOP.includes(r.primary) && r.date.startsWith(m)).length) });
    stackedColumns(document.getElementById("ch-month"), { cats: months.map(mlab), series, height: 250, aria: "Complaints by month" });
    document.getElementById("lg-month").innerHTML = series.map(s => `<span><i class="key-rect" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");
    const app = R.filter(r => r.primary === "app");
    const vers = {}; for (const r of R) { vers[r.version] = vers[r.version] || { all: 0, app: 0 }; vers[r.version].all++; if (r.primary === "app") vers[r.version].app++; }
    const vrows = Object.entries(vers).sort((a, b) => b[0].localeCompare(a[0], undefined, { numeric: true })).slice(0, 8)
      .map(([v, o]) => `<tr><td class="strong">${esc(v)}</td><td class="num">${o.all}</td><td class="num">${o.app}</td><td class="num">${fPct(o.app / o.all)}</td></tr>`).join("");
    document.getElementById("verTbl").innerHTML = `<thead><tr><th>Version</th><th class="num">Reviews</th><th class="num">App complaints</th><th class="num">Share</th></tr></thead><tbody>${vrows}</tbody>`;
  },
});

/* D · All reviews explorer */
const EX = { driver: "all", rating: "all", q: "", page: 0 };
SLIDES.push({
  id: "explorer", tab: "Reviews", n: "D", noprint: true,
  html() {
    const opts = [["all", "All drivers"]].concat(ranked.map(k => [k, label(k)])).concat([["praise", "Praise"]]);
    return head("D · Every review, tagged", `All ${fInt(M.n)} reviews with their tags. Filter by driver or stars, or search the text.`, "Use this when asked \"show me\": every number in the pack traces back to these rows.", "") +
      `<div class="card"><div class="filters">
        <label for="fDriver">Driver</label><select id="fDriver">${opts.map(([k, l]) => `<option value="${k}"${EX.driver === k ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>
        <label for="fRating">Stars</label><select id="fRating"><option value="all">All</option>${[1, 2, 3, 4, 5].map(s => `<option value="${s}"${String(EX.rating) === String(s) ? " selected" : ""}>${s}★</option>`).join("")}</select>
        <input type="search" id="fQ" placeholder="Search text, e.g. refund, wax, 1 pm" value="${esc(EX.q)}" aria-label="Search review text">
        <span class="muted" id="fCount"></span>
      </div><div class="tbl-wrap"><table class="tbl rv" id="rvTbl"></table></div><div class="pager"><button class="icon-btn" id="pPrev">Previous</button><span id="pInfo"></span><button class="icon-btn" id="pNext">Next</button></div></div>` + foot("Appendix D");
  },
  bind(root) {
    const PAGE = 25;
    const draw = () => {
      const q = EX.q.trim().toLowerCase();
      const rows = R.filter(r => (EX.driver === "all" || r.primary === EX.driver) && (EX.rating === "all" || r.rating === +EX.rating) && (!q || (r.title + " " + r.text).toLowerCase().includes(q)));
      const pages = Math.max(1, Math.ceil(rows.length / PAGE)); EX.page = Math.min(EX.page, pages - 1);
      const slice = rows.slice(EX.page * PAGE, EX.page * PAGE + PAGE);
      root.querySelector("#fCount").textContent = `${rows.length} reviews`;
      root.querySelector("#pInfo").textContent = `Page ${EX.page + 1} of ${pages}`;
      root.querySelector("#rvTbl").innerHTML = `<thead><tr><th>#</th><th>Date</th><th>Stars</th><th>Driver</th><th>Review</th></tr></thead><tbody>` + slice.map(r => `<tr>
        <td class="muted num">${r.n}</td><td class="nowrap">${esc(dfmt(r.date))}</td><td>${stars(r.rating)}</td>
        <td><span class="tag${TOP.includes(r.primary) ? "" : r.primary === "praise" ? " green" : " gray"}">${esc(label(r.primary))}</span><div class="muted" style="font-size:11.5px;margin-top:2px">${esc(SUB[r.subtag] || r.subtag)}${r.contacted === "yes" ? " · contacted support" : ""}${r.churn ? " · will leave" : ""}</div></td>
        <td class="txt"><span class="t">${esc(r.title)}</span> <span class="ink2">${esc(r.text)}</span></td></tr>`).join("") + `</tbody>`;
    };
    root.querySelector("#fDriver").addEventListener("change", e => { EX.driver = e.target.value; EX.page = 0; draw(); });
    root.querySelector("#fRating").addEventListener("change", e => { EX.rating = e.target.value; EX.page = 0; draw(); });
    root.querySelector("#fQ").addEventListener("input", e => { EX.q = e.target.value; EX.page = 0; draw(); });
    root.querySelector("#pPrev").addEventListener("click", () => { EX.page = Math.max(0, EX.page - 1); draw(); });
    root.querySelector("#pNext").addEventListener("click", () => { EX.page++; draw(); });
    draw();
  },
});

/* E · Built for this role */
SLIDES.push({
  id: "role", tab: "JD fit", n: "E",
  html() {
    const rows = S.jd.map(([a, b, c]) => `<tr><td class="strong" style="width:22%">${esc(a)}</td><td class="ink2" style="width:38%">${esc(b)}</td><td>${esc(c)}</td></tr>`).join("");
    return head("E · Why I built this", "Each JD line, where it shows up in this teardown, and where I've done it before.", "", "Prepared by Chethan") +
      `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>The JD asks for</th><th>In this teardown</th><th>Where I've done it before</th></tr></thead><tbody>${rows}</tbody></table></div></div>` + foot("Appendix E");
  },

/* ---------- shell ---------- */
const deck = document.getElementById("deck"), tabs = document.getElementById("tabs");
document.getElementById("subLabel").textContent = `${M.app} · ${fInt(M.n)} App Store reviews`;
SLIDES.forEach((s, i) => {
  const sec = document.createElement("section");
  sec.className = "slide" + (s.noprint ? " noprint" : ""); sec.id = s.id; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-label", s.tab);
  deck.append(sec);
  const b = document.createElement("button");
  b.className = "tab" + (s.sep ? " sep" : ""); b.setAttribute("role", "tab"); b.dataset.i = i;
  const n = document.createElement("span"); n.className = "n"; n.textContent = s.n;
  b.append(n, document.createTextNode(s.tab)); b.addEventListener("click", () => go(i));
  tabs.append(b);
});
let cur = 0;
const rendered = new Set();
function renderSlide(i, force) {
  const s = SLIDES[i], sec = deck.children[i];
  if (force || !rendered.has(i)) { sec.innerHTML = s.html(); bindTips(sec); if (s.bind) s.bind(sec); rendered.add(i); }
  if (s.charts) s.charts();
}
function render(force) { renderSlide(cur, force); fit(); }
function go(i) {
  cur = (i + SLIDES.length) % SLIDES.length;
  [...deck.children].forEach((el, j) => el.classList.toggle("active", j === cur));
  [...tabs.children].forEach((el, j) => el.setAttribute("aria-selected", j === cur ? "true" : "false"));
  tabs.children[cur].scrollIntoView({ block: "nearest", inline: "nearest" });
  hideTip(); renderSlide(cur); fit();
  try { history.replaceState(null, "", "#" + SLIDES[cur].id); } catch (e) { /* file:// may refuse */ }
}
function fit() {
  const sec = deck.children[cur]; sec.style.zoom = "";
  if (!document.body.classList.contains("present")) return;
  const avail = innerHeight - 56 - 24, h = sec.scrollHeight;
  if (h > avail) sec.style.zoom = Math.max(0.72, avail / h).toFixed(3);
}
document.getElementById("prevBtn").addEventListener("click", () => go(cur - 1));
document.getElementById("nextBtn").addEventListener("click", () => go(cur + 1));
function togglePresent() {
  const on = !document.body.classList.contains("present");
  document.body.classList.toggle("present", on);
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    else if (!on && document.fullscreenElement) document.exitFullscreen();
  } catch (e) { /* full screen not allowed here */ }
  setTimeout(() => render(), 120);
}
document.getElementById("presentBtn").addEventListener("click", togglePresent);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) { document.body.classList.remove("present"); render(); } });
document.getElementById("themeBtn").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("cdt-theme", t); } catch (e) { /* storage blocked */ }
});
function themeLabel() { document.getElementById("themeBtn").textContent = isDark() ? "Light" : "Dark"; }
try { const t = localStorage.getItem("cdt-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
themeLabel();
const KEYS = Object.fromEntries(SLIDES.map((s, i) => [s.n.toLowerCase(), i]));
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("select, input")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && document.body.classList.contains("present"))) { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key === "f" || e.key === "F") togglePresent();
  else if (KEYS[e.key.toLowerCase()] !== undefined) go(KEYS[e.key.toLowerCase()]);
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(), 150); });
function renderAll() {
  document.body.classList.add("printing");
  SLIDES.forEach((s, i) => { const sec = deck.children[i]; sec.style.zoom = ""; sec.innerHTML = s.html(); bindTips(sec); if (s.bind) s.bind(sec); });
  SLIDES.forEach(s => s.charts && s.charts());
  rendered.clear();
}
addEventListener("beforeprint", renderAll);
addEventListener("afterprint", () => { document.body.classList.remove("printing"); rendered.clear(); go(cur); });
const start = SLIDES.findIndex(s => "#" + s.id === location.hash);
if (/[?&]print\b/.test(location.search)) renderAll(); else go(start >= 0 ? start : 0);
function onThemeChange() { themeLabel(); rendered.clear(); if (document.body.classList.contains("printing")) renderAll(); else render(true); }
if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", onThemeChange);
new MutationObserver(onThemeChange).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
