<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VP Ops Weekly MIS</title>
<style>
:root {
  color-scheme: light;
  --page: #f3f3f0;
  --surface: #ffffff;
  --surface-2: #f7f7f4;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #7d7b75;
  --grid: #e7e6e0;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: #e8f1fc;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --good-ink: #006300;
  --warn-ink: #7a5000;
  --crit-ink: #b02a2a;
  --good-bg: #e5f5e5;
  --warn-bg: #fff3d6;
  --crit-bg: #fbe7e7;
  --info-bg: #efefeb;
  --soft-bar: #86b6ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #222220;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #95938c;
    --grid: #2c2c2a;
    --axis: #444441;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: #15283f;
    --good-ink: #3fc23f;
    --warn-ink: #f5c04d;
    --crit-ink: #f07a7a;
    --good-bg: #13301a;
    --warn-bg: #3a2e10;
    --crit-bg: #3d1a1a;
    --info-bg: #2a2a28;
    --soft-bar: #1c5cab;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #95938c;
  --grid: #2c2c2a;
  --axis: #444441;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-soft: #15283f;
  --good-ink: #3fc23f;
  --warn-ink: #f5c04d;
  --crit-ink: #f07a7a;
  --good-bg: #13301a;
  --warn-bg: #3a2e10;
  --crit-bg: #3d1a1a;
  --info-bg: #2a2a28;
  --soft-bar: #1c5cab;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* ---------- app bar ---------- */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding-block: 0;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: var(--ink); color: var(--surface);
  display: grid; place-items: center; font-weight: 700; font-size: 11px; letter-spacing: .02em;
}
.brand-text { line-height: 1.15; white-space: nowrap; }
.brand-text b { font-size: 14px; }
.brand-text span { display: block; font-size: 12px; color: var(--muted); }
.mock-pill {
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
  background: var(--warn-bg); color: var(--warn-ink); white-space: nowrap;
}
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; padding: 7px 10px; border-radius: 8px;
  font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.tab:hover { background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.tab .n { opacity: .6; margin-right: 4px; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 6px; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; font-size: 13px; color: var(--ink-2);
}
.icon-btn:hover { background: var(--surface-2); }

/* ---------- slides ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.deck { padding-block: 18px 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.slide { display: none; max-width: 1400px; margin: 0 auto; transform-origin: top center; }
.slide.active { display: block; }
.slide-head { display: flex; align-items: flex-end; gap: 24px; margin: 2px 0 14px; }
.slide-head .titles { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
h2.title { font-size: 23px; line-height: 1.25; margin: 4px 0 4px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
.subtitle { color: var(--ink-2); font-size: 13.5px; margin: 0; }
.slide-meta { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.slide-foot {
  display: flex; justify-content: space-between; gap: 16px; margin-top: 12px;
  font-size: 11.5px; color: var(--muted);
}

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; }
.c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; }
.c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.mt { margin-top: 12px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; box-shadow: var(--shadow); min-width: 0;
}
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card-t { font-size: 13.5px; font-weight: 650; margin: 0; }
.card-s { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.card-h .right { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* stat tiles */
.tiles { display: grid; gap: 12px; }
.tiles.t4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles.t3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { padding: 12px 14px; }
.tile .lbl { font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.tile .val { font-size: 26px; font-weight: 650; line-height: 1.15; margin-top: 4px; letter-spacing: -0.01em; }
.tile .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.delta { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.delta.good { color: var(--good-ink); } .delta.bad { color: var(--crit-ink); } .delta.flat { color: var(--muted); }

/* RAG pills: icon + label, never colour alone */
.rag {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 3px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 16px;
}
.rag i {
  font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
  font-size: 10px; color: #fff; font-weight: 800;
}
.rag.g { background: var(--good-bg); color: var(--good-ink); } .rag.g i { background: var(--good); }
.rag.a { background: var(--warn-bg); color: var(--warn-ink); } .rag.a i { background: var(--warn); color: #3a2a00; }
.rag.r { background: var(--crit-bg); color: var(--crit-ink); } .rag.r i { background: var(--crit); }
.rag.n { background: var(--info-bg); color: var(--ink-2); } .rag.n i { background: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.g { background: var(--good); } .dot.a { background: var(--warn); } .dot.r { background: var(--crit); } .dot.n { background: var(--axis); }

/* tables */
table { border-collapse: collapse; width: 100%; }
.tbl { font-size: 12.5px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
  padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap;
}
.tbl td { padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .ctr { text-align: center; }
.tbl tr.block td {
  background: var(--surface-2); font-weight: 650; font-size: 11.5px; color: var(--ink-2);
  letter-spacing: .02em; padding: 5px 8px;
}
.tbl tr.total td { font-weight: 650; border-top: 1px solid var(--axis); }
.tbl tr.hl td { background: var(--accent-soft); }
.tbl .metric { font-weight: 550; }
.tbl .owner { color: var(--ink-2); white-space: nowrap; }
.tbl.compact td { padding: 3px 8px; }
.tbl svg, .tbl .rag { vertical-align: middle; }
.tbl svg { display: inline-block; }
.muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
.strong { font-weight: 650; }
.nowrap { white-space: nowrap; }

/* lists & text blocks */
.issue { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--grid); }
.issue:first-of-type { border-top: 0; padding-top: 2px; }
.issue .n {
  width: 22px; height: 22px; border-radius: 6px; background: var(--crit-bg); color: var(--crit-ink);
  font-weight: 700; font-size: 12px; display: grid; place-items: center;
}
.issue .n.g { background: var(--good-bg); color: var(--good-ink); }
.issue .n.q { background: var(--accent-soft); color: var(--accent); }
.issue p { margin: 0; font-size: 12.8px; }
.issue .meta { font-size: 11.8px; color: var(--muted); margin-top: 2px; }
.kv { display: grid; grid-template-columns: 112px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); font-weight: 600; font-size: 12px; padding-top: 1px; }
.kv dd { margin: 0; }
.callout {
  border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0;
  padding: 9px 12px; font-size: 12.8px;
}
.callout b { font-weight: 650; }
.callout + .callout { margin-top: 8px; }
.tag {
  display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
  background: var(--crit-bg); color: var(--crit-ink); vertical-align: 1px; margin-left: 6px; letter-spacing: .02em;
}
.tag.blue { background: var(--accent-soft); color: var(--accent); }

/* hero */
.hero .lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.hero .big { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; margin: 10px 0 6px; }
.hero .line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.hero .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.hero .mini div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.hero .mini b { display: block; color: var(--ink); font-size: 15px; font-weight: 650; }
.formula {
  margin-top: 12px; font-size: 12px; color: var(--ink-2); background: var(--surface-2);
  border-radius: 8px; padding: 8px 10px;
}
.formula code { font: inherit; font-weight: 650; color: var(--ink); }

/* inline bars (funnels) */
.bar-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-fill.soft { background: var(--soft-bar); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: inherit; }
.ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gl { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.bl { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.lbl-ink { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.lbl-2 { fill: var(--ink-2); font-size: 11.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.key-dash { width: 14px; height: 0; border-top: 2px dashed var(--muted); display: inline-block; }
.key-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.scale .ramp { height: 8px; flex: 1; border-radius: 4px; }

.heat { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.heat th { font-weight: 600; color: var(--muted); font-size: 11.5px; padding: 2px 4px; text-align: center; }
.heat th.rowh { text-align: left; width: 44px; }
.heat td {
  text-align: center; border-radius: 4px; height: 26px; font-variant-numeric: tabular-nums; font-weight: 600; cursor: default;
}
.heat td:hover, .heat td:focus { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat td.empty { background: var(--surface-2); color: var(--muted); font-weight: 400; }

/* tooltip */
.tip {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 140px;
}
.tip .tt { font-weight: 650; margin-bottom: 4px; color: var(--ink-2); }
.tip .tr { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .tr .k { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.tip .tr .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* scope filter */
.filters { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-2); }
select {
  font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px;
}

/* manager cards */
.mgrs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.mgr .name { font-weight: 650; font-size: 13.5px; }
.mgr .role { font-size: 11.5px; color: var(--muted); }
.mgr .kpis { margin: 8px 0; display: grid; gap: 3px; font-size: 12px; color: var(--ink-2); }
.mgr .nums { display: flex; gap: 14px; border-top: 1px solid var(--grid); padding-top: 8px; font-size: 11.5px; color: var(--muted); }
.mgr .nums b { display: block; font-size: 16px; color: var(--ink); font-weight: 650; }
.mgr .nums b.bad { color: var(--crit-ink); }

.flag { font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.flag.r { color: var(--crit-ink); } .flag.a { color: var(--warn-ink); } .flag.g { color: var(--good-ink); } .flag.n { color: var(--muted); }
.status { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }

.rhythm { display: grid; gap: 0; }
.rhythm .step { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 5px 0; border-top: 1px solid var(--grid); font-size: 12.5px; }
.rhythm .step:first-child { border-top: 0; padding-top: 0; }
.rhythm .when { font-weight: 650; color: var(--accent); font-size: 12px; }
.rhythm .what b { font-weight: 650; }
.rhythm .what span { color: var(--muted); display: block; font-size: 12px; }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.ladder div { background: var(--surface-2); border-radius: 8px; padding: 7px 8px; font-size: 11.5px; color: var(--ink-2); }
.ladder b { display: block; color: var(--ink); font-size: 12px; margin-bottom: 2px; }
.rules { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.rules li { margin: 2px 0; }

.check { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--grid); font-size: 12.5px; align-items: start; }
.check:first-child { border-top: 0; padding-top: 0; }
.check .d { color: var(--muted); font-size: 12px; }

.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.plan div { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; }
.plan b { display: block; color: var(--accent); font-size: 12px; margin-bottom: 3px; }
.facts { font-size: 12.5px; display: grid; gap: 4px; }
.facts div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--grid); padding: 3px 0; }
.facts div:last-child { border-bottom: 0; }
.jd td:first-child { font-weight: 600; }
.jd td { vertical-align: top; }

/* present mode */
body.present .appbar .brand-text span, body.present .mock-pill { display: none; }

/* small screens */
@media (max-width: 1100px) {
  .c2, .c3, .c4, .c5, .c6, .c7, .c8, .c9 { grid-column: span 12; }
  .tiles.t4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mgrs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand-text span { display: none; }
}
@media (max-width: 700px) {
  .appbar { height: auto; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .tabs { order: 3; width: 100%; margin-left: 0; }
  .deck { padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .slide-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .slide-meta { text-align: left; }
  .tiles.t4, .tiles.t3, .mgrs, .plan, .ladder { grid-template-columns: 1fr; }
  .hero .big { font-size: 46px; }
  .tbl-wrap { overflow-x: auto; }
  h2.title { font-size: 20px; }
}

/* print / PDF: one slide per landscape page */
@page { size: 1440px 900px; margin: 0; }
body.printing .appbar { display: none; }
body.printing .deck { padding: 0; }
body.printing::before { display: none; }
body.printing .slide {
  display: block; width: 1440px; height: 900px; max-width: none; padding: 26px 32px 20px; overflow: hidden;
  break-after: page; page-break-after: always; position: relative;
}
body.printing .slide-foot { position: absolute; left: 32px; right: 32px; bottom: 16px; }
@media print {
  .appbar { display: none; }
  .tip { display: none !important; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">MIS</div>
    <div class="brand-text"><b>VP Ops · Weekly Business Review</b><span id="weekLabel"></span></div>
    <span class="mock-pill" title="Every number in this pack is mock data, built for an interview demo">Mock data</span>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Slides"></nav>
  <div class="tools">
    <button class="icon-btn" id="prevBtn" aria-label="Previous slide">←</button>
    <button class="icon-btn" id="nextBtn" aria-label="Next slide">→</button>
    <button class="icon-btn" id="presentBtn" title="Full screen (F)">Present</button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark">Dark</button>
  </div>
</header>

<script>
(() => {
"use strict";
const D = DATA;
const CUR = D.meta.cur, PREV = D.meta.prev, WEEKS = D.meta.weeks;
const REPORT = new Date(D.meta.report_date + "T00:00:00");

/* ---------------- formatting ---------------- */
const MINUS = "−";
const nf = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
const fInt = n => nf.format(Math.round(n));
const fPct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const fLakh = r => r >= 1e7 ? "₹" + (r / 1e7).toFixed(2) + " Cr" : "₹" + (r / 1e5).toFixed(1) + " L";
const signed = (x, txt) => (x > 0 ? "+" : x < 0 ? MINUS : "±") + txt;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wk = w => "W" + w;
const dfmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const daysBetween = (a, b) => Math.round((b - a) / 86400000);

/* ---------------- aggregation ---------------- */
const FIELDS = ["req", "asg", "cc", "pc", "comp", "ot", "perfect", "cpl", "redo", "rc", "rs", "low", "act", "cert", "stock", "coh", "coh_a", "gmv"];
function agg(weeks, city) {
  const ws = Array.isArray(weeks) ? weeks : [weeks];
  const o = Object.fromEntries(FIELDS.map(f => [f, 0]));
  o.n = ws.length;
  for (const r of D.rows) {
    if (!ws.includes(r.week)) continue;
    if (city && city !== "All India" && r.city !== city) continue;
    for (const f of FIELDS) o[f] += r[f];
  }
  return o;
}

/* KPI definitions: one place for formula, target, direction and owner */
const KPIS = [
  { key: "nsm", block: "North Star", name: "Perfect booking rate", f: a => a.perfect / a.req, fmt: "pct", dir: "up", target: 0.77, owner: "All five" },
  { key: "req", block: "Demand & fulfilment", name: "Booking requests", f: a => a.req / a.n, fmt: "int", dir: "info", good: "up", owner: "City Ops" },
  { key: "fill", name: "Fill rate", f: a => a.asg / a.req, fmt: "pct", dir: "up", target: 0.95, owner: "City Ops" },
  { key: "comp", name: "Jobs completed", f: a => a.comp / a.n, fmt: "int", dir: "info", good: "up", owner: "City Ops" },
  { key: "ot", name: "On-time arrival", f: a => a.ot / a.comp, fmt: "pct", dir: "up", target: 0.92, owner: "City Ops" },
  { key: "cc", name: "Cancellations, customer side", f: a => a.cc / a.asg, fmt: "pct", dir: "down", target: 0.03, owner: "CX" },
  { key: "pc", name: "Cancellations, partner side", f: a => a.pc / a.asg, fmt: "pct", dir: "down", target: 0.015, owner: "Supply" },
  { key: "act", block: "Partner supply", name: "Active partners (1+ job)", f: a => a.act / a.n, fmt: "int", dir: "up", target: 7600, owner: "Supply", national: true },
  { key: "cert", name: "New partners certified", f: a => a.cert / a.n, fmt: "int", dir: "up", target: 200, owner: "Training & QA", national: true },
  { key: "ret", name: "90-day retention (cohort)", f: a => a.coh_a / a.coh, fmt: "pct0", dir: "up", target: 0.70, owner: "Supply" },
  { key: "jppd", block: "Productivity", name: "Jobs per active partner per day", f: a => a.comp / (a.act * 6), fmt: "d2", dir: "up", target: 1.65, owner: "City Ops" },
  { key: "rating", block: "Quality", name: "Average rating", f: a => a.rs / a.rc, fmt: "d2", dir: "up", target: 4.70, owner: "Training & QA" },
  { key: "cpk", name: "Complaints per 1,000 jobs", f: a => a.cpl / a.comp * 1000, fmt: "d1", dir: "down", target: 8.0, owner: "CX" },
  { key: "redo", name: "Redo / refund rate", f: a => a.redo / a.comp, fmt: "pct", dir: "down", target: 0.012, owner: "CX" },
  { key: "kit", block: "Kits", name: "Partners with a kit stock-out", f: a => a.stock / a.act, fmt: "pct", dir: "down", target: 0.02, owner: "Inventory" },
];
const K = Object.fromEntries(KPIS.map(k => [k.key, k]));

function fmtV(k, v) {
  if (v == null || !isFinite(v)) return "—";
  switch (k.fmt) {
    case "pct": return fPct(v, 1);
    case "pct0": return fPct(v, 0);
    case "int": return fInt(v);
    case "d1": return v.toFixed(1);
    case "d2": return v.toFixed(2);
  }
  return String(v);
}
function fmtTarget(k) {
  if (k.target == null) return "—";
  const p = k.dir === "down" ? "<" : "≥";
  if (k.fmt === "int") return fInt(k.target);
  return p + fmtV(k, k.target).replace(/\.0%$/, "%");
}
function status(k, v, scopeCity) {
  if (k.dir === "info" || k.target == null) return "n";
  if (k.national && scopeCity && scopeCity !== "All India") return "n";
  if (k.dir === "up") return v >= k.target ? "g" : v >= k.target * 0.95 ? "a" : "r";
  return v <= k.target ? "g" : v <= k.target * 1.05 ? "a" : "r";
}
function delta(k, v, lv) {
  const up = (k.good || k.dir) === "up";
  const d = v - lv;
  const cls = Math.abs(d) < 1e-9 ? "flat" : (d > 0) === up ? "good" : "bad";
  let txt;
  if (k.fmt === "pct" || k.fmt === "pct0") txt = signed(d, Math.abs(d * 100).toFixed(1) + " pts");
  else if (k.fmt === "int") txt = signed(d, Math.abs((v / lv - 1) * 100).toFixed(1) + "%");
  else txt = signed(d, Math.abs(d).toFixed(k.fmt === "d1" ? 1 : 2));
  return { cls, txt };
}
const RAG_LABEL = { g: "Green", a: "Amber", r: "Red", n: "Info" };
const RAG_ICON = { g: "✓", a: "!", r: "✕", n: "–" };
const rag = (s, label) => `<span class="rag ${s}"><i aria-hidden="true">${RAG_ICON[s]}</i>${label || RAG_LABEL[s]}</span>`;
const dot = s => `<span class="dot ${s}" aria-hidden="true"></span>`;

function series(k, city) { return WEEKS.map(w => k.f(agg(w, city))); }

/* ---------------- theme-aware palette ---------------- */
const darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t === "dark" || (t !== "light" && !!(darkQuery && darkQuery.matches));
}
function pal() {
  const dark = isDark();
  return dark ? {
    dark, accent: "#3987e5", soft: "#1c5cab", gray: "#6f6d67", s2: "#d95926", ink: "#f0efec", ink2: "#c3c2b7",
    muted: "#95938c", grid: "#2c2c2a", surface: "#1a1a19", mid: "#383835",
    redArm: ["#383835", "#7a3434", "#c24a4a", "#e66767"], blueArm: ["#383835", "#1c5cab", "#3987e5"],
    seq: ["#0d366b", "#184f95", "#256abf", "#3987e5", "#86b6ef"],
  } : {
    dark, accent: "#2a78d6", soft: "#86b6ef", gray: "#b9b7ae", s2: "#eb6834", ink: "#0b0b0b", ink2: "#52514e",
    muted: "#7d7b75", grid: "#e7e6e0", surface: "#ffffff", mid: "#f0efec",
    redArm: ["#f0efec", "#f4b9b3", "#e66a63", "#c43a3a"], blueArm: ["#f0efec", "#b7d3f6", "#2a78d6"],
    seq: ["#cde2fb", "#86b6ef", "#3987e5", "#1c5cab", "#104281"],
  };
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")"; }
function ramp(stops, t) {
  t = Math.max(0, Math.min(1, t));
  const seg = (stops.length - 1) * t, i = Math.min(stops.length - 2, Math.floor(seg));
  return mix(stops[i], stops[i + 1], seg - i);
}
function inkOn(rgb) {
  const [r, g, b] = rgb.match(/\d+/g).map(Number).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return L < 0.32 ? "#ffffff" : "#0b0b0b";
}

/* ---------------- tooltip ---------------- */
const tip = document.getElementById("tip");
function showTip(e, title, rows) {
  tip.replaceChildren();
  if (title) { const t = document.createElement("div"); t.className = "tt"; t.textContent = title; tip.append(t); }
  for (const r of rows) {
    const row = document.createElement("div"); row.className = "tr";
    const k = document.createElement("span"); k.className = "k";
    if (r.color) { const s = document.createElement("span"); s.className = "key-line"; s.style.background = r.color; k.append(s); }
    k.append(document.createTextNode(r.k));
    const v = document.createElement("span"); v.className = "v"; v.textContent = r.v;
    row.append(k, v); tip.append(row);
  }
  tip.style.display = "block";
  moveTip(e);
}
function moveTip(e) {
  const x = e.clientX, y = e.clientY, w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y + 14;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top + h > innerHeight - 8) top = y - h - 14;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { tip.style.display = "none"; }
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    const data = JSON.parse(el.dataset.tip);
    const on = e => showTip(e.clientX ? e : centerEvt(el), data.t, data.r);
    el.addEventListener("pointermove", on);
    el.addEventListener("focus", on);
    el.addEventListener("pointerleave", hideTip);
    el.addEventListener("blur", hideTip);
  });
}
function centerEvt(el) { const r = el.getBoundingClientRect(); return { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }; }
const tipAttr = (t, r) => `data-tip='${esc(JSON.stringify({ t, r }))}' tabindex="0"`;

/* ---------------- charts ---------------- */
function niceTicks(min, max, count = 4) {
  const span = max - min || 1;
  const step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(10));
  return t;
}

/* Line chart with crosshair, end labels and an optional target line. */
function lineChart(el, o) {
  const P = pal();
  const W = Math.max(260, el.clientWidth), H = o.height || 200;
  const m = { l: o.ml || 44, r: o.mr || 58, t: 12, b: 24 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = o.series.flatMap(s => s.values).concat(o.target != null ? [o.target] : []);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.05;
  lo -= pad; hi += pad;
  if (o.yMin != null) lo = o.yMin;
  const ticks = niceTicks(lo, hi, 4);
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const n = o.labels.length;
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}">`;
  for (const t of ticks) s += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${esc(o.yFmt(t))}</text>`;
  o.labels.forEach((l, i) => { if (i % (o.every || 2) === (n - 1) % (o.every || 2)) s += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  if (o.target != null) {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(o.target)}" y2="${y(o.target)}" style="stroke:${P.muted}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s += `<text class="ax" x="${W - m.r + 6}" y="${y(o.target) + 4}">${esc(o.targetLabel || "Target")}</text>`;
  }
  for (const se of o.series) {
    const d = se.values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    if (o.area && o.series.length === 1) s += `<path d="${d} L${x(n - 1)} ${m.t + ih} L${x(0)} ${m.t + ih} Z" style="fill:${se.color};opacity:.10"/>`;
    s += `<path d="${d}" fill="none" style="stroke:${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lx = x(n - 1), ly = y(se.values[n - 1]);
    s += `<circle cx="${lx}" cy="${ly}" r="4.5" style="fill:${se.color};stroke:${P.surface}" stroke-width="2"/>`;
    const dy = se.labelDy || 0;
    s += `<text class="lbl-ink" x="${lx + 8}" y="${ly + 4 + dy}">${esc(se.end || o.yFmtLong(se.values[n - 1]))}</text>`;
  }
  s += `<g class="xh" style="display:none"><line class="xhl" y1="${m.t}" y2="${m.t + ih}" style="stroke:${P.ink2}" stroke-width="1"/>`;
  o.series.forEach((se, j) => { s += `<circle class="xhd${j}" r="4" style="fill:${se.color};stroke:${P.surface}" stroke-width="2"/>`; });
  s += `</g><rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), hit = svg.querySelector(".hit");
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (iw / (n - 1)))));
    xh.style.display = "";
    xh.querySelector(".xhl").setAttribute("x1", x(i)); xh.querySelector(".xhl").setAttribute("x2", x(i));
    o.series.forEach((se, j) => { const c = xh.querySelector(".xhd" + j); c.setAttribute("cx", x(i)); c.setAttribute("cy", y(se.values[i])); });
    const rows = o.series.map(se => ({ k: se.name, v: o.yFmtLong(se.values[i]), color: se.color }));
    if (o.extra) rows.push(...o.extra(i));
    showTip(e, o.tipTitle ? o.tipTitle(i) : o.labels[i], rows);
  });
  hit.addEventListener("pointerleave", () => { xh.style.display = "none"; hideTip(); });
}

/* Sparkline: de-emphasised line, current point in the accent */
function spark(vals, w = 92, h = 22) {
  const P = pal();
  const lo = Math.min(...vals), hi = Math.max(...vals), n = vals.length;
  const x = i => 2 + i * (w - 6) / (n - 1), y = v => h - 3 - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - 6);
  const d = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:${P.gray}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${x(n - 1)}" cy="${y(vals[n - 1])}" r="3" style="fill:${P.accent}"/></svg>`;
}

/* Dumbbell: last week -> this week, per item */
function dumbbell(el, o) {
  const P = pal();
  const W = Math.max(280, el.clientWidth), rowH = o.rowH || 24, lw = o.labelW || 128, rw = o.valW || 92;
  const H = o.items.length * rowH + 22;
  const vmax = Math.max(...o.items.flatMap(it => [it.a, it.b])) * 1.08;
  const x = v => lw + v / vmax * (W - lw - rw);
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}">`;
  const ticks = niceTicks(0, vmax, 4).filter(t => t <= vmax);
  for (const t of ticks) s += `<line class="gl" x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H - 18}"/><text class="ax" x="${x(t)}" y="${H - 4}" text-anchor="middle">${esc(o.fmt(t))}</text>`;
  o.items.forEach((it, i) => {
    const cy = i * rowH + rowH / 2;
    const hl = o.highlight && o.highlight(it);
    s += `<text x="0" y="${cy + 4}" style="fill:${P.ink};font-size:12px;font-weight:${hl ? 700 : 400}">${esc(it.label)}</text>`;
    s += `<line x1="${x(it.a)}" x2="${x(it.b)}" y1="${cy}" y2="${cy}" style="stroke:${hl ? P.accent : P.gray}" stroke-width="2"/>`;
    s += `<circle cx="${x(it.a)}" cy="${cy}" r="4.5" style="fill:${P.soft};stroke:${P.surface}" stroke-width="2"/>`;
    s += `<circle cx="${x(it.b)}" cy="${cy}" r="5" style="fill:${hl ? P.accent : P.ink2};stroke:${P.surface}" stroke-width="2"/>`;
    const d = it.b - it.a;
    s += `<text x="${W - rw + 8}" y="${cy + 4}" class="lbl-ink">${esc(o.fmt(it.b))}<tspan style="fill:${P.muted};font-weight:400"> ${esc(signed(d, o.fmt(Math.abs(d))))}</tspan></text>`;
    s += `<rect x="0" y="${i * rowH}" width="${W}" height="${rowH}" fill="transparent" ${tipAttr(it.label, [{ k: o.aLabel, v: o.fmt(it.a) }, { k: o.bLabel, v: o.fmt(it.b) }].concat(it.extra || []))}/>`;
  });
  s += `</svg>`;

/* Horizontal bars, one series, optional emphasis */
function hbars(el, o) {
  const P = pal();
  const W = Math.max(260, el.clientWidth), rowH = o.rowH || 22, lw = o.labelW || 140, rw = o.valW || 54;
  const H = o.items.length * rowH;
  const vmax = Math.max(...o.items.map(i => i.v));
  const x = v => v / vmax * (W - lw - rw);
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}">`;
  o.items.forEach((it, i) => {
    const cy = i * rowH + rowH / 2, bh = Math.min(14, rowH - 8);
    const hl = o.highlight ? o.highlight(it, i) : true;
    s += `<text x="0" y="${cy + 4}" style="fill:${P.ink};font-size:12px">${esc(it.label)}</text>`;
    const bw = Math.max(2, x(it.v));
    s += `<path d="M${lw} ${cy - bh / 2} h${bw - 4} a4 4 0 0 1 4 4 v${bh - 8} a4 4 0 0 1 -4 4 h${-(bw - 4)} Z" style="fill:${hl ? P.accent : P.gray}"/>`;
    s += `<text x="${lw + bw + 6}" y="${cy + 4}" class="lbl-ink">${esc(o.fmt(it.v))}</text>`;
    s += `<rect x="0" y="${i * rowH}" width="${W}" height="${rowH}" fill="transparent" ${tipAttr(it.label, it.tip || [{ k: o.vLabel || "Value", v: o.fmt(it.v) }])}/>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  bindTips(el);
}

/* Columns, one series, emphasis on selected columns */
function columns(el, o) {
  const P = pal();
  const W = Math.max(240, el.clientWidth), H = o.height || 170;
  const m = { l: 6, r: 6, t: 18, b: 34 };
  const n = o.items.length, band = (W - m.l - m.r) / n, bw = Math.min(28, band * 0.56);
  const vmax = Math.max(...o.items.map(i => i.v));
  const ih = H - m.t - m.b, y = v => m.t + ih - v / vmax * ih;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}"><line class="bl" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  o.items.forEach((it, i) => {
    const cx = m.l + band * i + band / 2, top = y(it.v), hgt = m.t + ih - top;
    const hl = o.highlight(it, i);
    s += `<path d="M${cx - bw / 2} ${m.t + ih} v${-(hgt - 4)} a4 4 0 0 1 4 -4 h${bw - 8} a4 4 0 0 1 4 4 v${hgt - 4} Z" style="fill:${hl ? P.accent : P.gray}"/>`;
    s += `<text class="lbl-ink" x="${cx}" y="${top - 5}" text-anchor="middle">${esc(o.fmt(it.v))}</text>`;
    s += `<text class="ax" x="${cx}" y="${H - 18}" text-anchor="middle">${esc(it.label)}</text>`;
    s += `<rect x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih + 20}" fill="transparent" ${tipAttr(it.tipT || it.label, it.tip || [{ k: "Value", v: o.fmt(it.v) }])}/>`;
  });
  if (o.axisNote) s += `<text class="ax" x="${W / 2}" y="${H - 2}" text-anchor="middle">${esc(o.axisNote)}</text>`;
  s += `</svg>`;
  el.innerHTML = s;
  bindTips(el);
}

/* Scatter with least-squares line; labels on the outliers only */
function scatter(el, o) {
  const P = pal();
  const W = Math.max(260, el.clientWidth), H = o.height || 210;
  const m = { l: 40, r: 14, t: 30, b: 34 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = o.pts.map(p => p.x), ys = o.pts.map(p => p.y);
  const xt = niceTicks(0, Math.max(...xs) * 1.05, 4), yt = niceTicks(0, Math.max(...ys) * 1.1, 4);
  const X = v => m.l + v / xt[xt.length - 1] * iw, Y = v => m.t + ih - v / yt[yt.length - 1] * ih;
  let s = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || "")}">`;
  for (const t of yt) s += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${esc(o.yFmt(t))}</text>`;
  for (const t of xt) s += `<text class="ax" x="${X(t)}" y="${m.t + ih + 15}" text-anchor="middle">${esc(o.xFmt(t))}</text>`;
  s += `<text class="ax" x="${m.l + iw / 2}" y="${H - 2}" text-anchor="middle">${esc(o.xLabel)}</text>`;
  s += `<text class="ax" x="${m.l - 34}" y="${m.t - 18}">${esc(o.yLabel)}</text>`;
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  const sxy = xs.reduce((a, v, i) => a + (v - mx) * (ys[i] - my), 0), sxx = xs.reduce((a, v) => a + (v - mx) ** 2, 0);
  const b = sxy / sxx, a0 = my - b * mx;
  const x2 = xt[xt.length - 1];
  s += `<line x1="${X(0)}" y1="${Y(a0)}" x2="${X(x2)}" y2="${Y(a0 + b * x2)}" style="stroke:${P.muted}" stroke-width="1.5"/>`;
  for (const p of o.pts) {
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" style="fill:${p.hl ? P.accent : P.gray};stroke:${P.surface}" stroke-width="2"/>`;
    if (p.hl) { const right = p.anchor === "start"; s += `<text class="lbl-2" x="${X(p.x) + (right ? 9 : -9)}" y="${Y(p.y) + 4 + (p.dy || 0)}" text-anchor="${right ? "start" : "end"}">${esc(p.label)}</text>`; }
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="12" fill="transparent" ${tipAttr(p.label + " · " + p.city, p.tip)}/>`;
  }
  s += `</svg>`;
  el.innerHTML = s;
  bindTips(el);
}
function correl(xs, ys) {
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0, syy = 0;
  xs.forEach((v, i) => { sxy += (v - mx) * (ys[i] - my); sxx += (v - mx) ** 2; syy += (ys[i] - my) ** 2; });
  return sxy / Math.sqrt(sxx * syy);
}

function flagOf(a) {
  const due = new Date(a.due + "T00:00:00");
  if (a.status === "Done") {
    const late = daysBetween(due, new Date(a.closed + "T00:00:00"));
    return late > 0 ? { c: "a", t: `Done ${late}d late`, rank: 9 } : { c: "g", t: "Done on time", rank: 10 };
  }
  const late = daysBetween(due, REPORT);
  if (/VP/.test(a.update) && late <= 0) return { c: "a", t: "Needs your OK", rank: 1.5 };
  if (late > 0) return { c: "r", t: `Overdue ${late}d`, rank: 0 - late / 100 };
  const left = -late;
  if (left <= 2) return { c: "a", t: left === 0 ? "Due today" : `Due in ${left}d`, rank: 1 + left / 100 };
  return { c: "g", t: "On track", rank: 2 + left / 100 };
}

        ${chk(true, "One fill-rate definition", "City Ops sheet said " + fPct(opsFill) + ", MIS said " + fPct(right) + ". See the box", "a")}

      </div>
      <div class="c4" style="display:grid;gap:12px;align-content:start">
        <div class="card"><p class="card-t">Same metric, two numbers</p>
          <p style="font-size:12.8px;margin:6px 0 0">City Ops reported fill rate at <b>${fPct(opsFill)}</b>. The MIS showed <b>${fPct(right)}</b>. Both were right by their own rule: City Ops left out 1,620 requests that customers cancelled within 5 minutes.</p>
          <p style="font-size:12.8px;margin:6px 0 0"><b>Fix:</b> one definition in the dictionary, signed off by all five managers (A-113). You get one number, with a one-line note on what changed.</p></div>
        <div class="card"><p class="card-t">The averaging trap</p>
          <p style="font-size:12.8px;margin:6px 0 8px">Averaging the 35 day-slot fill rates gives <b>${fPct(simple)}</b>. Adding up the counts first gives <b>${fPct(right)}</b>. The shortcut reads ${((simple - right) * 100).toFixed(1)} pts too high and hides ${fPct((simple - right) / (sL.fill - sA.fill), 0)} of this week's drop, because a quiet Monday slot counts as much as a packed Sunday evening.</p>
          <table class="tbl compact"><tbody><tr><td>Average of 35 slot rates</td><td class="num">${fPct(simple)}</td><td>${rag("r", "Wrong")}</td></tr><tr><td>Total assigned ÷ total requests</td><td class="num">${fPct(right)}</td><td>${rag("g", "Right")}</td></tr></tbody></table></div>
      </div>
      <div class="card c4"><p class="card-t" style="margin-bottom:6px">Metric dictionary, v1</p>
        <table class="tbl compact"><tbody>${dict}</tbody></table></div>
    </div>` + footer("A", "Checks run on the ops app extract every Monday before 11:00 (mock). Dictionary v1, shared 18 Oct.");
  },
});

/* B. Built for this role */
SLIDES.push({
  id: "role", tab: "Built for this role", n: "B",
  html() {
    const rows = [
      ["MIS reporting and dashboards", "Slides 1–5, plus an Excel workbook where one data tab feeds every number", "LVX: automated dashboards in Google Sheets and Power BI tracking ₹7 Cr+ of pipeline. Reporting accuracy up 30%"],
      ["Turn data into insights", "The leak split on slide 1, the ₹ impact tiles, and the kits → cancellations → fill rate link", "LVX: funnel analysis across ₹3.5 Cr, ₹7 Cr and ₹9 Cr+ launches. Conversion up 20%"],

      ["Strong Excel and Google Sheets", "Week and city selectors recalculate the whole MIS: SUMIFS, INDEX-MATCH, named ranges, validation", "Advanced Excel. Automated Google Sheets dashboards at LVX"],
      ["Partner supply and ops", "Slide 4: onboarding funnel, cohort retention, utilisation", "Built a network of 1,400+ healthcare practitioners and 15+ hospital tie-ups. Ran sourcing, inventory and QC at Gomedha"],

    ].map(([a, b, c]) => `<tr><td>${esc(a)}</td><td class="ink2">${esc(b)}</td><td>${esc(c)}</td></tr>`).join("");
    return head("B · Why this pack exists",
      `Every part of this pack maps to a line in the job description, and to work I have already done.`,
      `Built as a working demo of the Founder's Office – Operations role: MIS, reviews, follow-up and clean data.`,

    `<div class="grid">
      <div class="card c8"><div class="tbl-wrap"><table class="tbl jd"><thead><tr><th style="width:24%">The JD asks for</th><th style="width:38%">Where it is in this pack</th><th>Where I've done it before</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="c4" style="display:grid;gap:12px;align-content:start">

/* ---------------- shell: tabs, navigation, present, theme ---------------- */
const deck = document.getElementById("deck"), tabs = document.getElementById("tabs");
document.getElementById("weekLabel").textContent = D.meta.week_label;
SLIDES.forEach((s, i) => {
  const sec = document.createElement("section");
  sec.className = "slide"; sec.id = s.id; sec.setAttribute("role", "tabpanel"); sec.setAttribute("aria-label", s.tab);
  deck.append(sec);
  const b = document.createElement("button");
  b.className = "tab"; b.setAttribute("role", "tab"); b.dataset.i = i;
  const n = document.createElement("span"); n.className = "n"; n.textContent = s.n || String(i + 1);
  b.append(n, document.createTextNode(s.tab));
  b.addEventListener("click", () => go(i));
  tabs.append(b);
});
let cur = 0;
const rendered = new Set();
function renderSlide(i, force) {
  const s = SLIDES[i], sec = deck.children[i];
  if (force || !rendered.has(i)) { sec.innerHTML = s.html(); if (s.bind) s.bind(sec); rendered.add(i); }
  if (s.charts) s.charts();
}
function render(force) { renderSlide(cur, force); fit(); }
function go(i) {
  cur = (i + SLIDES.length) % SLIDES.length;
  [...deck.children].forEach((el, j) => el.classList.toggle("active", j === cur));
  [...tabs.children].forEach((el, j) => el.setAttribute("aria-selected", j === cur ? "true" : "false"));
  tabs.children[cur].scrollIntoView({ block: "nearest", inline: "nearest" });
  hideTip();
  renderSlide(cur);
  fit();
  try { history.replaceState(null, "", "#" + SLIDES[cur].id); } catch (e) { /* file:// may refuse */ }
}
// In present mode, scale a tall slide down so it fits the screen without scrolling
function fit() {
  const sec = deck.children[cur];
  sec.style.zoom = "";
  if (!document.body.classList.contains("present")) return;
  const avail = innerHeight - 56 - 24, h = sec.scrollHeight;
  if (h > avail) sec.style.zoom = Math.max(0.72, avail / h).toFixed(3);
}
document.getElementById("prevBtn").addEventListener("click", () => go(cur - 1));
document.getElementById("nextBtn").addEventListener("click", () => go(cur + 1));
document.getElementById("presentBtn").addEventListener("click", togglePresent);
function togglePresent() {
  const on = !document.body.classList.contains("present");
  document.body.classList.toggle("present", on);
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    else if (!on && document.fullscreenElement) document.exitFullscreen();
  } catch (e) { /* full screen not allowed here */ }
  setTimeout(() => render(), 120);
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) { document.body.classList.remove("present"); render(); } });
document.getElementById("themeBtn").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("mis-theme", t); } catch (e) { /* storage blocked */ }
});
function themeLabel() { document.getElementById("themeBtn").textContent = isDark() ? "Light" : "Dark"; }

try { const t = localStorage.getItem("mis-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }
themeLabel();
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("select, input")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && document.body.classList.contains("present"))) { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key === "f" || e.key === "F") togglePresent();
  else if (/^[1-6]$/.test(e.key)) go(+e.key - 1);
  else if (e.key === "a" || e.key === "A") go(6);
  else if (e.key === "b" || e.key === "B") go(7);
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(), 150); });

// Print and PDF: lay every slide out at 1440 x 900, then draw all charts
function renderAll() {
  document.body.classList.add("printing");
  SLIDES.forEach((s, i) => { deck.children[i].style.zoom = ""; deck.children[i].innerHTML = s.html(); if (s.bind) s.bind(deck.children[i]); });
  SLIDES.forEach(s => s.charts && s.charts());
  rendered.clear();
}
addEventListener("beforeprint", renderAll);
addEventListener("afterprint", () => { document.body.classList.remove("printing"); rendered.clear(); go(cur); });
window.__renderAll = renderAll;

const start = SLIDES.findIndex(s => "#" + s.id === location.hash);
if (/[?&]print\b/.test(location.search)) renderAll(); else go(start >= 0 ? start : 0);

// Redraw the charts when the theme changes: the button, the OS setting, or the host's own choice
function onThemeChange() {
  themeLabel();
  rendered.clear();
  if (document.body.classList.contains("printing")) renderAll(); else render(true);
}
if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener("change", onThemeChange);
new MutationObserver(onThemeChange).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
